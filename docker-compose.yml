services:
  agent:
    build:
      context: .
      dockerfile: containers/zoomy_jax_claude/Dockerfile
    image: zoomy-jax-claude:latest
    volumes:
      # Syncs your code: Change in container = Change on Thinkpad
      - .:/workspace
      # Persists Claude Max login (No re-auth every build)
      - ~/.claude:/root/.claude
      # Persists your shell history
      - ~/.zsh_history:/root/.zsh_history
    working_dir: /workspace
    environment:
      - SHELL=/bin/zsh
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
