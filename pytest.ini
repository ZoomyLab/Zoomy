[pytest]
addopts = --import-mode=importlib
testpaths =
  tests
  library/*/tests
norecursedirs =
  library/firedrake_animate
markers = 
  small: quick test (<5 min individually; DEFAULT for unmarked tests via root conftest)
  medium: moderate runtime test
  large: expensive test (any test taking >5 min individually is large), disabled by default
  smoke: import/run smoke validation
  benchmark: performance-oriented benchmark test
  tutorial: a tutorials/ notebook executed end to end on the CPU (tests/tutorials; opt-in: -m tutorial; requires: gpu|mpi|container notebooks are skipped)
  pyodide: tutorial case intended for pyodide/browser execution
  numpy: test targeting NumPy backend
  jax: test targeting JAX backend
  core: tests that only require zoomy_core runtime
  amrex: tests requiring AMReX runtime/container
  openfoam: tests requiring OpenFOAM/preCICE runtime/container
  petsc: tests requiring PETSc runtime/container
  dmplex: DMPlex stack tests (applied from path in conftest; use for CI reports)
  fenicsx: FEniCSx / dolfinx stack tests (applied from path in conftest)
  firedrake: tests requiring Firedrake runtime/container
  slow: slow test
  critical: critical tests always need to pass
  broken: currently unsupported
  parallel: solver run in parallel
  old: testcases from old code versions, filed for reference
  unfinished: test creation not finished
  future: placeholder to be implemented
  unittest: unit tests
  regression: regression tests
  nbworking: notebook is running though
  nbcorrect: notebook gives correct result
  postprocessing: postproc suite (prepost/plotting/server IO, style, readers, lift3d)
  gui: GUI-facing server contract tests
  qr: thesis QR-code cases, CPython + Pyodide (opt-in: -m qr; tests/qr_cases)
  qr_jax: the QR case that needs jax (subset of qr)
  qr_live: QR targets on the deployed site (opt-in: -m qr_live; run after deploy)
  qr_deploy: the deployed GUI serves this commit's wheels and mirrored data (opt-in: -m qr_deploy; run after this commit's deploy)
  qr_browser: every QR notebook session in headless Chromium, Run All twice (opt-in: -m qr_browser; QR_GUI_BASE, QR_GUI_SITE)
  backend_e2e: GUI sessions / cards and a matrix subset through the backend containers (opt-in: -m backend_e2e; tests/backend_e2e)


filterwarnings =
  ignore::DeprecationWarning:compas.*:
  ignore::DeprecationWarning:sympy.*:
  ignore:Jupyter is migrating its paths.*:DeprecationWarning
