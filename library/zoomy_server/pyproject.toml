[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomy-server"
version = "0.2.0"
description = "FastAPI solver server for Zoomy — submits and manages simulation jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [
  { name = "Ingo Steldermann", email = "steldermann@mbd.rwth-aachen.de" }
]
keywords = ["simulation", "server", "zoomy", "solver"]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "zoomy-core>=0.2.0",
]

[project.optional-dependencies]
jax = ["zoomy-jax"]

[project.scripts]
zoomy-server = "zoomy_server.cli:main"
zoomy-jupyter = "zoomy_server.jupyter:main"

[project.urls]
Homepage = "https://github.com/mbd-rwth/Zoomy"
Source = "https://github.com/mbd-rwth/Zoomy"

[tool.setuptools.packages.find]
include = ["zoomy_server*"]
