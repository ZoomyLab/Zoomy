[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomy-mesh"
version = "0.1.0"
description = "Mesh format converter for Zoomy: HDF5 <-> Gmsh (.msh) with boundary physical groups."
requires-python = ">=3.11"
license = { text = "GNU" }
authors = [
  { name = "Ingo Steldermann", email = "steldermann@mbd.rwth-aachen.de" }
]

dependencies = [
  "zoomy-core",
  "meshio",
  "numpy",
  "h5py",
]

[tool.setuptools.packages.find]
include = ["zoomy_mesh*"]
