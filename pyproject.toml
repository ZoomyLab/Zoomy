[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "zoomy-jax"
version = "0.1.0"
description = "JAX solver backend for the Zoomy simulation framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [
  { name = "Ingo Steldermann", email = "steldermann@mbd.rwth-aachen.de" }
]
keywords = ["jax", "simulation", "zoomy", "shallow flow", "physics", "autodiff"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]


dependencies = [
  # JAX ecosystem (CPU build; the GPU build is the optional extra `cuda`)
  "jax>=0.7.0",
  "h5py",                    # HDF5 output / mesh input (fvm/solver_jax.py, misc/io.py)
  "equinox>=0.13",           # reverse-mode AD: checkpointed time loop (ad_mode=AdMode.reverse)

  # the pure-Python core: models, symbolic derivation, mesh, NumPy solvers
  "zoomy-core>=0.2.17",
]

[project.optional-dependencies]
# Example: pip install "zoomy-jax[cuda]"
cuda = ["jax[cuda12]>=0.7.0"]
server = ["zoomy-server"]
# Learned multigrid / GNN preconditioner experiments (zoomy_jax.gnn_blueprint).
gnn = ["equinox>=0.13", "optax", "jraph"]

[project.urls]
Homepage = "https://github.com/ZoomyLab/Zoomy"
Documentation = "https://zoomylab.github.io/Zoomy"
Source = "https://github.com/ZoomyLab/Zoomy"
Issues = "https://github.com/ZoomyLab/Zoomy/issues"


[tool.setuptools.packages.find]
include = ["zoomy_jax*"]

[tool.setuptools.package-data]
zoomy_jax = ["LICENSE", "README.md"]
"zoomy_jax.gnn_blueprint" = ["*.sh", "README.md"]

# Standalone runs (rootdir = zoomy_jax, where the superrepo pytest.ini and
# root conftest are invisible).  Marker names follow the SUPERREPO
# conventions (small/medium/large/regression + the jax stack tag) — never
# zoomy_core's pyproject-local gate/rederive/area names, which superrepo-root
# runs cannot see.  Under the superrepo, its pytest.ini owns configuration
# and auto-marks these tests jax + small; the explicit in-file markers keep
# standalone runs warning-free and addressable.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
  "small: fast default-tier test (superrepo convention)",
  "medium: mid-cost test (superrepo convention)",
  "large: real time-march / simulation test; deselected by default, enable with --run-large (>5 min individually is large)",
  "regression: end-state march asserted against blessed baselines in tests/goldens",
  "jax: requires the jax stack (auto-applied by the superrepo conftest)",
]
