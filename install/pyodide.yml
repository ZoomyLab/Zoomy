name: pyodide
channels:
  - conda-forge
dependencies:
  # Python version must be 3.10+
  - python=3.10

  # Required system dependencies
  - git
  - nodejs>=18          # Needed for the JS part of the build
  - pkg-config
  - cmake
  - make
  - patch
  - automake
  - autoconf
  - libtool

  # Recommended for better compatibility
  - wget
  - llvmdev
  - cffi
  - pybind11

  # Required Python build tools
  - pip
  - pip:
      - build
      - packaging
      - setuptools>=65
      - wheel
      - pyodide-cli     # Provides "pyodide" command
      - pyodide-build   # Core Pyodide build machinery

