name: zoomy

# Pinned versions captured from a working local mamba solve.
# Pinning the top-level deps shrinks libsolv's search space so
# CI solves complete in minutes instead of hours.

channels:
  - conda-forge
  - lrntct

dependencies:
  - python=3.11.15
  - sympy=1.14.0
  - attrs=26.1.0
  - numpy=2.4.6
  - ipython=9.13.0
  - ipykernel=7.2.0
  - matplotlib=3.10.9
  - pytest=9.0.3
  - pytest-html=4.2.0
  - meshio=5.3.5
  - scipy=1.17.1
  - h5py=3.16.0
  - pyvista=0.48.4
  - trame=3.13.2
  - trame-vtk=2.11.8
  - trame-vuetify=3.2.2
  - seaborn=0.13.2
  - panel=1.8.10
  - pygments=2.20.0
  - swashes=1.5.0  # from lrntct channel
  - pyswashes=0.2.1
  - gmsh=4.15.2
  - python-gmsh=4.15.2
  - jupytext=1.19.3
  - rasterio=1.4.4
  - pip=26.1.1
  - jupyter-cache=1.0.1
  - pip:
    - pyprog
    - watchfiles
    - tol-colors
    - python-dotenv
    - Cython
