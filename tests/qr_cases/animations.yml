vam_bump: https://zoomylab.github.io/Zoomy/gui/#/open?project=gui/projects/thesis-gifs.zip&path=vam_bump.gif
curvedchannel: https://zoomylab.github.io/Zoomy/gui/#/open?project=gui/projects/thesis-gifs.zip&path=curvedchannel.gif
