sme_self: https://zoomylab.github.io/Zoomy/gui/#/open?project=gui/projects/thesis-gifs.zip&path=sme_self.gif
sme1_sme2: https://zoomylab.github.io/Zoomy/gui/#/open?project=gui/projects/thesis-gifs.zip&path=sme1_sme2.gif
# The non-hydrostatic bump of ch. 5 and the curved channel of the applications
