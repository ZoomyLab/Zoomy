macdonald_relax: https://zoomylab.github.io/Zoomy/gui/#/open?project=gui/projects/thesis-gifs.zip&path=macdonald_relax.gif
ritter_front: https://zoomylab.github.io/Zoomy/gui/#/open?project=gui/projects/thesis-gifs.zip&path=ritter_front.gif
# The two coupling verification animations of ch. 5.4, same pattern: margin QR
