        sections:
          - file: developer/installation
          - file: developer/templates
          - file: developer/template_vs_backends
          - file: developer/extending
          - file: developer/tutorials
          - file: developer/tests
  - caption: Reference
    chapters:
      - file: api/index
        sections:
          - file: api/_autodoc2/zoomy_core/zoomy_core
            sections:
              - glob: api/_autodoc2/zoomy_core/zoomy_core.*
          - file: api/_autodoc2/zoomy_jax/zoomy_jax
            sections:
              - glob: api/_autodoc2/zoomy_jax/zoomy_jax.*
          - file: api/_autodoc2/zoomy_foam/zoomy_foam
            sections:
              - glob: api/_autodoc2/zoomy_foam/zoomy_foam.*
          - file: api/_autodoc2/zoomy_amrex/zoomy_amrex
            sections:
              - glob: api/_autodoc2/zoomy_amrex/zoomy_amrex.*
      - file: literature
      - file: acknowledgements
      - file: cite
