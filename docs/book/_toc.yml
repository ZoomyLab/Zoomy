format: jb-book
root: index
parts:
  - caption: Get started
    chapters:
      - file: installation
      - file: containers
      - file: browser
  - caption: User guide
    chapters:
      - file: guide/index
        title: Overview
        sections:
          - file: guide/quickstart
          - file: guide/model
          - file: guide/system-model
          - file: guide/numerical-system-model
          - file: guide/solvers
      # The one tutorials entry.  The notebooks (tutorials/ipynb/, generated by
