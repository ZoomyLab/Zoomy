title: Zoomy Documentation
author: ZoomyLab
logo: ../../web/images/logo.svg

execute:
  execute_notebooks: "off"

only_build_toc_files: false

repository:
  url: https://github.com/mbd-rwth/Zoomy
  branch: main
  path_to_book: docs/book

launch_buttons:
  thebe: true
  binderhub_url: "https://mybinder.org"
  notebook_interface: "jupyterlab"

sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.napoleon
  config:
    # Long stdout/stderr in frozen tutorial notebooks: limit vertical growth (see also cell tag scroll-output).
    nb_scroll_outputs: true
    html_css_files:
      - notebook-output-scroll.css
    autodoc_mock_imports:
      - petsc4py
      - firedrake
      - pyop2
      - ufl
      - finat
      - FIAT
      - tsfc
      - meshio
      - h5py
      - gmsh
      - precice
      - jax
      - jaxlib
    autodoc_default_options:
      members: true
      undoc-members: false
    html_theme: sphinx_book_theme
    html_title: Zoomy Documentation
    copyright: "2026, ZoomyLab"
    suppress_warnings:
      - toc.excluded
      - toc.not_included
    html_theme_options:
      use_download_button: false
      extra_footer: '<a href="about.html">About</a> · <a href="legal.html">Legal notice and data protection</a>'
