title: Zoomy Documentation
author: ZoomyLab
logo: ../images/logo.svg

execute:
  execute_notebooks: "off"

only_build_toc_files: false
exclude_patterns: [_build]

repository:
  url: https://github.com/ZoomyLab/Zoomy
  branch: main
  path_to_book: docs/book

launch_buttons:
  thebe: true
  binderhub_url: "https://mybinder.org"
  notebook_interface: "jupyterlab"

# third_party.bib: third-party software, rendered on acknowledgements.md
# literature.bib: publications cited by the code, rendered on literature.md
#   (generated by docs/scripts/collect_references.py).
# Each page names its bib file in the {bibliography} directive; the keys of the
# two files must stay disjoint.
bibtex_bibfiles:
  - references/third_party.bib
  - references/literature.bib

# Docstrings are Markdown: `:param x:` field lists in them are MyST fieldlists.
# Jupyter Book 1 REPLACES its default extension list with this one (it does not append),
# so the defaults are listed again: `colon_fence` is what the `:::{grid}` card pages
# (home, tutorials) are written in; without it they render as literal text.
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - tasklist
    - fieldlist

sphinx:
  # Docstrings are Markdown (MyST), never reStructuredText: the API reference is
  # written by sphinx-autodoc2 (static analysis, nothing is imported), and each
  # docstring is parsed by zoomy_docstrings.Parser, MyST plus a hook for the
  # napoleon-style Args:/Returns:/References: sections.  Pages land in
  # api/_autodoc2/ (generated by docs/scripts/generate_apidoc.py, never committed).
  local_extensions:
    zoomy_docstrings: _ext
  extra_extensions:
    - autodoc2
  config:
    # Generate id anchors for h1-h3 so in-page links like
    # containers.md#three-modes resolve.
    myst_heading_anchors: 3
    # describe() returns an object with a _repr_markdown_ that emits $$...$$
    # LaTeX. Without this, myst-nb passes text/markdown outputs through as
    # LITERAL text and the operator matrices render as raw \begin{matrix}.
    nb_render_markdown_format: myst
    # Long stdout/stderr in frozen tutorial notebooks: limit vertical growth (see also cell tag scroll-output).
    nb_scroll_outputs: true
    html_css_files:
      - notebook-output-scroll.css
      - notebook-download.css
      - cards.css
      - tutorial-filter.css
    html_js_files:
      - tutorial-filter.js
      - notebook-download.js
    autodoc2_packages:
      - path: ../../library/zoomy_core/zoomy_core
        module: zoomy_core
        exclude_dirs: [__pycache__, tests, analysis, decorators, fvm, kernel, misc,
                       postprocessing, solver, symbolic, transformation]
      - path: ../../library/zoomy_jax/zoomy_jax
        module: zoomy_jax
        exclude_dirs: [__pycache__, tests, fvm, gnn_blueprint, mesh, misc, template,
                       transformation]
      - path: ../../library/zoomy_foam/zoomy_foam
        module: zoomy_foam
        exclude_dirs: [__pycache__, tests]
      - path: ../../library/zoomy_amrex/zoomy_amrex
        module: zoomy_amrex
        exclude_dirs: [__pycache__, tests]
    autodoc2_output_dir: api/_autodoc2
    autodoc2_render_plugin: myst
    autodoc2_docstring_parser_regexes:
      - [".*", zoomy_docstrings]
    autodoc2_index_template: null
    autodoc2_sort_names: false
    autodoc2_class_docstring: merge
    autodoc2_hidden_objects: [private, dunder, inherited]
    html_theme: sphinx_book_theme
    html_title: Zoomy Documentation
    copyright: "2026, ZoomyLab"
    suppress_warnings:
      - toc.excluded
      - toc.not_included
    html_theme_options:
      use_download_button: true
      navigation_depth: 4
      show_nav_level: 2
      extra_footer: '<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;width:100%;"><div><a href="/Zoomy/about.html">About</a> · <a href="/Zoomy/legal.html">Legal notice and data protection</a></div><a href="https://www.mbd.rwth-aachen.de/" target="_blank" rel="noopener" title="MBD - RWTH Aachen University"><img src="/Zoomy/_static/logo_mbd_footer.png" alt="MBD - RWTH Aachen University" style="height:44px;width:auto;vertical-align:middle;"></a></div>'
