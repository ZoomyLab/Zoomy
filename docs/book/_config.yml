title: Zoomy Documentation
author: ZoomyLab
logo: ../images/logo.svg

execute:
  execute_notebooks: "off"

only_build_toc_files: false

repository:
  url: https://github.com/ZoomyLab/Zoomy
  branch: main
  path_to_book: docs/book

launch_buttons:
  thebe: true
  binderhub_url: "https://mybinder.org"
  notebook_interface: "jupyterlab"

sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.napoleon
  config:
    # Generate id anchors for h1-h3 so in-page links like
    # installation.md#prebuilt-containers resolve.
    myst_heading_anchors: 3
    # describe() returns an object with a _repr_markdown_ that emits $$...$$
    # LaTeX. Without this, myst-nb passes text/markdown outputs through as
    # LITERAL text and the operator matrices render as raw \begin{matrix}.
    nb_render_markdown_format: myst
    # Long stdout/stderr in frozen tutorial notebooks: limit vertical growth (see also cell tag scroll-output).
    nb_scroll_outputs: true
    html_css_files:
      - notebook-output-scroll.css
    autodoc_mock_imports:
      - petsc4py
      - firedrake
      - pyop2
      - ufl
      - finat
      - FIAT
      - tsfc
      - meshio
      - h5py
      - gmsh
      - precice
    autodoc_default_options:
      members: true
      undoc-members: false
    autodoc_member_order: bysource
    autodoc_typehints: description
    html_theme: sphinx_book_theme
    html_title: Zoomy Documentation
    copyright: "2026, ZoomyLab"
    suppress_warnings:
      - toc.excluded
      - toc.not_included
    html_theme_options:
      use_download_button: false
      navigation_depth: 4
      show_nav_level: 2
      extra_footer: '<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;width:100%;"><div><a href="about.html">About</a> · <a href="legal.html">Legal notice and data protection</a></div><a href="https://www.mbd.rwth-aachen.de/" target="_blank" rel="noopener" title="MBD - RWTH Aachen University"><img src="/Zoomy/_static/logo_mbd_footer.png" alt="MBD - RWTH Aachen University" style="height:44px;width:auto;vertical-align:middle;"></a></div>'
