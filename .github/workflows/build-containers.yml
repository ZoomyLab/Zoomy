name: Containers

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - "install/**"
      - "library/zoomy_core/pyproject.toml"
      - "library/zoomy_jax/pyproject.toml"
      - "library/zoomy_firedrake/pyproject.toml"
      - ".github/workflows/build-containers.yml"
      - ".github/workflows/dockers.txt"
  workflow_dispatch:
    inputs:
      container:
        description: "Build a specific container (folder name under containers/)"
        required: false
        default: ""

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-dockers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.load.outputs.list }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - id: load
        run: |
          list=$(
            grep -v '^[[:space:]]*$' .github/workflows/dockers.txt \
            | sed 's/[[:space:]]*,[[:space:]]*$//' \
            | jq -R . | jq -sc .
          )
          echo "list=$list" >> "$GITHUB_OUTPUT"

  detect-containers:
    runs-on: ubuntu-latest
    needs: load-dockers
    outputs:
      tier1: ${{ steps.detect.outputs.tier1 }}
      tier2: ${{ steps.detect.outputs.tier2 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          submodules: recursive

      - id: detect
        run: |
          set -eo pipefail
          ALL=$(echo '${{ needs.load-dockers.outputs.list }}' | jq -r '.[]')

          RAW=()
          add_raw() {
            local x="$1"
            [[ " ${RAW[*]} " == *" $x "* ]] || RAW+=("$x")
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.container }}" ]; then
            add_raw "${{ github.event.inputs.container }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch without specific container: rebuild all
            for c in $ALL; do add_raw "$c"; done
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
              head="HEAD"
            fi
            echo "Diff range: $base -> $head"

            for c in $ALL; do
              if ! git diff --quiet "$base" "$head" -- "containers/$c/Dockerfile" 2>/dev/null; then
                echo "Dockerfile changed: containers/$c"
                add_raw "$c"
              fi
              if ! git diff --quiet "$base" "$head" -- "containers/$c/*.def" 2>/dev/null; then
                echo "Apptainer def changed: containers/$c"
                add_raw "$c"
              fi
            done

            shopt -s nullglob
            for f in install/*.yml install/*.yaml; do
              if ! git diff --quiet "$base" "$head" -- "$f" 2>/dev/null; then
                echo "Install spec changed: $f -> JAX stack"
                add_raw "zoomy_jax_dev"
                add_raw "zoomy_jax"
              fi
            done

            if ! git diff --quiet "$base" "$head" -- library/zoomy_core/pyproject.toml 2>/dev/null; then
              add_raw "zoomy_core"
              add_raw "zoomy_jax"
              add_raw "zoomy_firedrake"
              add_raw "zoomy_amrex_dummy"
              add_raw "zoomy_fenicsx_dummy"
            fi
            if ! git diff --quiet "$base" "$head" -- library/zoomy_jax/pyproject.toml 2>/dev/null; then
              add_raw "zoomy_jax"
            fi
            if ! git diff --quiet "$base" "$head" -- library/zoomy_firedrake/pyproject.toml 2>/dev/null; then
              add_raw "zoomy_firedrake"
            fi
          fi

          EXP=()
          add_exp() {
            local x="$1"
            [[ " ${EXP[*]} " == *" $x "* ]] || EXP+=("$x")
          }

          for c in "${RAW[@]}"; do
            add_exp "$c"
            case "$c" in
              zoomy_jax_dev) add_exp "zoomy_jax" ;;
              zoomy_firedrake_dev) add_exp "zoomy_firedrake" ;;
            esac
          done

          # Tier 1: heavy bases (Firedrake/PETSc, micromamba+JAX, …). Tier 2: thin images on top for CI/pull;
          # they pull :latest tier-1 from GHCR. Pairing is one-way (dev → release) so editing a tier-2 Dockerfile
          # alone does not rebuild tier 1.
          TIER1_NAMES=" zoomy_core zoomy_jax_dev zoomy_firedrake_dev zoomy_amrex zoomy_dmplex zoomy_openfoam zoomy_amrex_dummy zoomy_fenicsx_dummy zoomy_numpy zoomy_postprocess "
          TIER2_NAMES=" zoomy_jax zoomy_firedrake "

          tier1=()
          tier2=()
          for c in $(printf '%s\n' "${EXP[@]}" | sort -u); do
            [ -z "$c" ] && continue
            [[ "$TIER1_NAMES" == *" $c "* ]] && tier1+=("$c")
            [[ "$TIER2_NAMES" == *" $c "* ]] && tier2+=("$c")
          done

          tier1_u=($(printf '%s\n' "${tier1[@]}" | sort -u))
          tier2_u=($(printf '%s\n' "${tier2[@]}" | sort -u))

          if [ ${#tier1_u[@]} -eq 0 ]; then
            echo 'tier1=[]' >> "$GITHUB_OUTPUT"
          else
            echo "tier1=$(printf '%s\n' "${tier1_u[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi
          if [ ${#tier2_u[@]} -eq 0 ]; then
            echo 'tier2=[]' >> "$GITHUB_OUTPUT"
          else
            echo "tier2=$(printf '%s\n' "${tier2_u[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug
        run: |
          echo "tier1=${{ steps.detect.outputs.tier1 }}"
          echo "tier2=${{ steps.detect.outputs.tier2 }}"

  build-tier1:
    runs-on: ubuntu-latest
    needs: detect-containers
    if: ${{ fromJson(needs.detect-containers.outputs.tier1)[0] }}
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.tier1) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Apptainer (if needed)
        if: ${{ hashFiles(format('containers/{0}/*.def', matrix.container)) != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq apptainer

      - id: build_image
        run: |
          set -eo pipefail
          c="${{ matrix.container }}"
          base_ver=$(tr -d '[:space:]' < "containers/$c/VERSION")
          full_ver="${base_ver}.${{ github.run_number }}"
          image="ghcr.io/$OWNER_LC/$c"
          echo "Building $image:$full_ver"

          has_dockerfile=false
          has_def=false
          [ -f "containers/$c/Dockerfile" ] && has_dockerfile=true
          def_file=$(find "containers/$c" -maxdepth 1 -name '*.def' | head -1)
          [ -n "$def_file" ] && has_def=true

          # Build Docker image (prefer Dockerfile if available)
          if [ "$has_dockerfile" = true ]; then
            echo "==> Docker build from Dockerfile"
            docker build --pull \
              -f "containers/$c/Dockerfile" \
              -t "$image:$full_ver" \
              -t "$image:latest" .
          elif [ "$has_def" = true ]; then
            echo "==> Apptainer build + convert to Docker: $def_file"
            sudo apptainer build "containers/$c/$c.sif" "$def_file"
            sudo apptainer build --sandbox "/tmp/${c}_sandbox" "containers/$c/$c.sif"
            # A bare `docker import` yields an EMPTY image Config — no
            # ENTRYPOINT/ENV/CMD — so the round-tripped Docker twin loses the
            # .def's server wiring and cannot serve the backend API (unlike the
            # Dockerfile-built twins, which bake ENTRYPOINT=zoomy-entry +
            # ZOOMY_ADAPTER). Reproduce the essentials via --change. The adapter
            # is the per-container BACKEND marker (single source of truth, also
            # consumed by the smoke test); ENTRYPOINT is the zoomy-entry the .def
            # installs at /usr/local/bin/zoomy-entry.
            chg=()
            if [ -f "containers/$c/BACKEND" ]; then
              adapter=$(tr -d '[:space:]' < "containers/$c/BACKEND")
              chg+=(--change 'ENTRYPOINT ["/usr/local/bin/zoomy-entry"]')
              chg+=(--change "ENV ZOOMY_ADAPTER=$adapter")
              chg+=(--change 'ENV ZOOMY_PORT=8080')
              chg+=(--change 'ENV ZOOMY_ROOT=/workspace')
              chg+=(--change 'ENV LC_ALL=C')
              echo "==> docker import with backend Config (adapter=$adapter)"
            else
              echo "==> docker import (non-backend def: no Config injected)"
            fi
            sudo tar -C "/tmp/${c}_sandbox" -c . | docker import "${chg[@]}" - "$image:$full_ver"
            docker tag "$image:$full_ver" "$image:latest"
            sudo rm -rf "/tmp/${c}_sandbox"
          fi

          echo "version=$full_ver" >> "$GITHUB_OUTPUT"

      - name: Push Docker image
        run: |
          c="${{ matrix.container }}"
          image="ghcr.io/$OWNER_LC/$c"
          docker push "$image:${{ steps.build_image.outputs.version }}"
          docker push "$image:latest"

      # Backend images (those with a containers/<c>/BACKEND marker) must boot the
      # solver API and report their adapter tag. Non-backends (core, *_dev,
      # *_dummy) have no marker and skip. Health-only — no simulation.
      - name: Smoke-test backend image
        if: ${{ hashFiles(format('containers/{0}/BACKEND', matrix.container)) != '' }}
        run: |
          set -eo pipefail
          c="${{ matrix.container }}"
          image="ghcr.io/$OWNER_LC/$c"
          ver="${{ steps.build_image.outputs.version }}"
          adapter=$(tr -d '[:space:]' < "containers/$c/BACKEND")
          echo "== Smoke: $image:$ver (expect status=ok tag=$adapter) =="
          cid=$(docker run -d -p 8080:8080 "$image:$ver")
          cleanup() { echo '--- container logs (tail) ---'; docker logs "$cid" 2>&1 | tail -n 40 || true; docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=""
          # ~90s budget (jax/firedrake/openfoam import slowly): 45 * 2s.
          for i in $(seq 1 45); do
            resp=$(curl -fsS http://localhost:8080/api/v1/health 2>/dev/null) || { sleep 2; continue; }
            echo "health[$i]: $resp"
            status=$(echo "$resp" | jq -r '.status // empty')
            tag=$(echo "$resp" | jq -r '.tag // empty')
            if [ "$status" = "ok" ] && [ "$tag" = "$adapter" ]; then ok=1; break; fi
            if [ -n "$status" ]; then
              echo "FAIL: server up but status=$status tag=$tag (expected ok/$adapter)"; exit 1
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "FAIL: /api/v1/health not ok/$adapter within ~90s"; exit 1; }
          echo "SMOKE PASS: $c -> status=ok tag=$adapter"

      - name: Build and push SIF (if .def exists)
        if: ${{ hashFiles(format('containers/{0}/*.def', matrix.container)) != '' }}
        run: |
          set -eo pipefail
          c="${{ matrix.container }}"
          base_ver=$(tr -d '[:space:]' < "containers/$c/VERSION")
          full_ver="${base_ver}.${{ github.run_number }}"
          image="ghcr.io/$OWNER_LC/$c"
          sif="containers/$c/$c.sif"

          # The build_image step already builds $sif directly from the .def (the
          # has_def path also derives the Docker image from that sif via a sandbox
          # import). REUSE it: rebuilding from docker-daemon both collides here
          # ("build target already exists") AND drops the .def's %runscript /
          # %environment / %startscript — `docker import` yields an empty Config, so
          # the round-tripped sif loses ZOOMY_ADAPTER and the dispatch runscript.
          # Only build from the Docker image when no def-built sif exists (a
          # Dockerfile-preferred container that also ships a .def).
          if [ -f "$sif" ]; then
            echo "==> Reusing SIF built from .def (preserves %runscript/%environment)"
          else
            echo "==> Building SIF from Docker image"
            sudo apptainer build "$sif" "docker-daemon:${image}:${full_ver}"
          fi
          sudo chown "$(id -u):$(id -g)" "$sif"

          echo "==> Pushing SIF to GHCR via ORAS"
          apptainer push "$sif" "oras://ghcr.io/$OWNER_LC/${c}_sif:${full_ver}" || \
            echo "WARNING: ORAS push failed (may need package visibility set to public)"
          apptainer push "$sif" "oras://ghcr.io/$OWNER_LC/${c}_sif:latest" || \
            echo "WARNING: ORAS push of :latest failed"

          rm -f "$sif"

  build-tier2:
    runs-on: ubuntu-latest
    needs: [detect-containers, build-tier1]
    if: |
      always() &&
      fromJson(needs.detect-containers.outputs.tier2)[0] &&
      (needs.build-tier1.result == 'success' || needs.build-tier1.result == 'skipped')
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.tier2) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build_image
        run: |
          set -eo pipefail
          c="${{ matrix.container }}"
          base_ver=$(tr -d '[:space:]' < "containers/$c/VERSION")
          full_ver="${base_ver}.${{ github.run_number }}"
          image="ghcr.io/$OWNER_LC/$c"
          echo "Building $image:$full_ver"
          if [ "$c" = "zoomy_jax" ]; then
            docker build --pull \
              --build-arg "JAX_DEV_IMAGE=ghcr.io/$OWNER_LC/zoomy_jax_dev:latest" \
              -f "containers/$c/Dockerfile" \
              -t "$image:$full_ver" \
              -t "$image:latest" .
          elif [ "$c" = "zoomy_firedrake" ]; then
            docker build --pull \
              --build-arg "FD_DEV_IMAGE=ghcr.io/$OWNER_LC/zoomy_firedrake_dev:latest" \
              -f "containers/$c/Dockerfile" \
              -t "$image:$full_ver" \
              -t "$image:latest" .
          else
            exit 1
          fi
          echo "version=$full_ver" >> "$GITHUB_OUTPUT"

      - name: Push
        run: |
          c="${{ matrix.container }}"
          image="ghcr.io/$OWNER_LC/$c"
          docker push "$image:${{ steps.build_image.outputs.version }}"
          docker push "$image:latest"

      # Same backend smoke as tier 1: boot the API, assert status=ok + adapter tag.
      - name: Smoke-test backend image
        if: ${{ hashFiles(format('containers/{0}/BACKEND', matrix.container)) != '' }}
        run: |
          set -eo pipefail
          c="${{ matrix.container }}"
          image="ghcr.io/$OWNER_LC/$c"
          ver="${{ steps.build_image.outputs.version }}"
          adapter=$(tr -d '[:space:]' < "containers/$c/BACKEND")
          echo "== Smoke: $image:$ver (expect status=ok tag=$adapter) =="
          cid=$(docker run -d -p 8080:8080 "$image:$ver")
          cleanup() { echo '--- container logs (tail) ---'; docker logs "$cid" 2>&1 | tail -n 40 || true; docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=""
          # ~90s budget (jax/firedrake/openfoam import slowly): 45 * 2s.
          for i in $(seq 1 45); do
            resp=$(curl -fsS http://localhost:8080/api/v1/health 2>/dev/null) || { sleep 2; continue; }
            echo "health[$i]: $resp"
            status=$(echo "$resp" | jq -r '.status // empty')
            tag=$(echo "$resp" | jq -r '.tag // empty')
            if [ "$status" = "ok" ] && [ "$tag" = "$adapter" ]; then ok=1; break; fi
            if [ -n "$status" ]; then
              echo "FAIL: server up but status=$status tag=$tag (expected ok/$adapter)"; exit 1
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "FAIL: /api/v1/health not ok/$adapter within ~90s"; exit 1; }
          echo "SMOKE PASS: $c -> status=ok tag=$adapter"

      - name: Install Apptainer (if needed)
        if: ${{ hashFiles(format('containers/{0}/*.def', matrix.container)) != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq apptainer

      # Same SIF publication as tier 1: backends are pulled as
      # oras://ghcr.io/<owner>/<name>_sif:latest by the GUI workflow.
      - name: Build and push SIF (if .def exists)
        if: ${{ hashFiles(format('containers/{0}/*.def', matrix.container)) != '' }}
        run: |
          set -eo pipefail
          c="${{ matrix.container }}"
          base_ver=$(tr -d '[:space:]' < "containers/$c/VERSION")
          full_ver="${base_ver}.${{ github.run_number }}"
          image="ghcr.io/$OWNER_LC/$c"
          sif="containers/$c/$c.sif"

          # Reuse a .def-built sif if the build_image step produced one (see the
          # tier-1 note); only convert from the Docker image otherwise.
          if [ -f "$sif" ]; then
            echo "==> Reusing SIF built from .def (preserves %runscript/%environment)"
          else
            echo "==> Building SIF from Docker image"
            sudo apptainer build "$sif" "docker-daemon:${image}:${full_ver}"
          fi
          sudo chown "$(id -u):$(id -g)" "$sif"

          echo "==> Pushing SIF to GHCR via ORAS"
          apptainer push "$sif" "oras://ghcr.io/$OWNER_LC/${c}_sif:${full_ver}" || \
            echo "WARNING: ORAS push failed (may need package visibility set to public)"
          apptainer push "$sif" "oras://ghcr.io/$OWNER_LC/${c}_sif:latest" || \
            echo "WARNING: ORAS push of :latest failed"

          rm -f "$sif"
