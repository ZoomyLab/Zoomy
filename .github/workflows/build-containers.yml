name: Containers

permissions:
  contents: read      # No longer need 'write' since we don't commit back
  packages: write     # Required to push to GHCR

on:
  push:
    paths:
      - "containers/**"
  workflow_dispatch:
    inputs:
      container:
        description: "Build a specific container (folder name)"
        required: false
      # 'bump' input is removed as it is no longer relevant for stateless versioning

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ------------------------------------------------------------
  # Job 1: Load list of container folders from dockers.txt
  # ------------------------------------------------------------
  load-dockers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.load.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: load
        run: |
          # Read lines, trim whitespace/commas, convert to JSON array
          list=$(
            sed 's/[[:space:]]*,[[:space:]]*$//' .github/workflows/dockers.txt \
            | jq -R . | jq -sc .
          )
          echo "list=$list" >> $GITHUB_OUTPUT


  # ------------------------------------------------------------
  # Job 2: Detect changes (Splits into Bases & Standalones)
  # ------------------------------------------------------------
  detect-containers:
    runs-on: ubuntu-latest
    needs: load-dockers
    outputs:
      bases: ${{ steps.detect.outputs.bases }}
      standalones: ${{ steps.detect.outputs.standalones }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - id: detect
        run: |
          set -eo pipefail
          
          # --- 1. Identify Direct Changes ---
          direct_changes=()
          
          # Manual override input
          if [ -n "${{ github.event.inputs.container }}" ]; then
            direct_changes+=("${{ github.event.inputs.container }}")
          else
            # Git Diff check
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            echo "Diffing range: $base -> $head"
            
            # Load full list of known containers
            all_containers=$(echo '${{ needs.load-dockers.outputs.list }}' | jq -r '.[]')

            for c in $all_containers; do
              # Check if Dockerfile changed
              if ! git diff --quiet "$base" "$head" -- "containers/$c/Dockerfile"; then
                 echo "Detected change in: containers/$c/Dockerfile"
                 direct_changes+=("$c")
              fi
            done
          fi

          # --- 2. Expand Dependencies ---
          # If 'zoomy_jax' changes, we must also build 'zoomy_jax_standalone'
          
          expanded_list=()
          all_containers_str=" $(echo '${{ needs.load-dockers.outputs.list }}' | jq -r '.[]') "

          for c in "${direct_changes[@]}"; do
            expanded_list+=("$c")
            
            # Check if this is a base container (doesn't end in _standalone)
            if [[ "$c" != *"_standalone" ]]; then
               candidate="${c}_standalone"
               # Check if the standalone version exists in our dockers.txt
               if [[ "$all_containers_str" == *" $candidate "* ]]; then
                   echo "Auto-triggering dependent container: $candidate"
                   expanded_list+=("$candidate")
               fi
            fi
          done

          # --- 3. Split into Bases and Standalones ---
          bases=()
          standalones=()
          
          # Remove duplicates
          unique_list=($(printf "%s\n" "${expanded_list[@]}" | sort -u))

          for c in "${unique_list[@]}"; do
            if [[ "$c" == *"_standalone" ]]; then
               standalones+=("$c")
            else
               bases+=("$c")
            fi
          done

          # --- 4. Output as JSON ---
          if [ ${#bases[@]} -eq 0 ]; then 
            echo "bases=[]" >> $GITHUB_OUTPUT
          else 
            json=$(printf '%s\n' "${bases[@]}" | jq -R . | jq -sc .)
            echo "bases=$json" >> $GITHUB_OUTPUT
          fi

          if [ ${#standalones[@]} -eq 0 ]; then 
            echo "standalones=[]" >> $GITHUB_OUTPUT
          else 
            json=$(printf '%s\n' "${standalones[@]}" | jq -R . | jq -sc .)
            echo "standalones=$json" >> $GITHUB_OUTPUT
          fi

      - name: Debug Output
        run: |
          echo "Bases to build: ${{ steps.detect.outputs.bases }}"
          echo "Standalones to build: ${{ steps.detect.outputs.standalones }}"


  # ------------------------------------------------------------
  # Job 3: Build Base Containers
  # ------------------------------------------------------------
  build-bases:
    runs-on: ubuntu-latest
    needs: detect-containers
    if: ${{ fromJson(needs.detect-containers.outputs.bases)[0] }}
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.bases) }}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build_image
        run: |
          set -eo pipefail
          container="${{ matrix.container }}"
          
          # Read base version (e.g. "0.4")
          base_ver=$(cat "containers/$container/VERSION" | tr -d '[:space:]')
          
          # Create dynamic build version (e.g. "0.4.105")
          # github.run_number provides a unique, increasing integer for this workflow
          full_ver="${base_ver}.${{ github.run_number }}"
          
          image="ghcr.io/$OWNER_LC/$container"
          
          echo "Building $image:$full_ver"

          docker build --pull \
            -f "containers/$container/Dockerfile" \
            -t "$image:$full_ver" \
            -t "$image:latest" .

          echo "version=$full_ver" >> $GITHUB_OUTPUT

      - name: Push image
        run: |
          container="${{ matrix.container }}"
          version="${{ steps.build_image.outputs.version }}"
          image="ghcr.io/$OWNER_LC/$container"
          
          docker push "$image:$version"
          docker push "$image:latest"


  # ------------------------------------------------------------
  # Job 4: Build Standalone Containers
  # ------------------------------------------------------------
  build-standalones:
    runs-on: ubuntu-latest
    needs: [detect-containers, build-bases]
    # Run if we have standalones AND the base build didn't fail (success or skipped is fine)
    if: |
      always() && 
      fromJson(needs.detect-containers.outputs.standalones)[0] && 
      (needs.build-bases.result == 'success' || needs.build-bases.result == 'skipped')

    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.standalones) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build_image
        run: |
          set -eo pipefail
          container="${{ matrix.container }}"
          
          # Read base version (e.g. "0.4")
          base_ver=$(cat "containers/$container/VERSION" | tr -d '[:space:]')
          
          # Create dynamic build version (e.g. "0.4.105")
          full_ver="${base_ver}.${{ github.run_number }}"
          
          image="ghcr.io/$OWNER_LC/$container"
          
          echo "Building $image:$full_ver"

          # --pull ensures we get the freshly built base image from Job 3
          docker build --pull \
            -f "containers/$container/Dockerfile" \
            -t "$image:$full_ver" \
            -t "$image:latest" .

          echo "version=$full_ver" >> $GITHUB_OUTPUT

      - name: Push image
        run: |
          container="${{ matrix.container }}"
          version="${{ steps.build_image.outputs.version }}"
          image="ghcr.io/$OWNER_LC/$container"
          
          docker push "$image:$version"
          docker push "$image:latest"
