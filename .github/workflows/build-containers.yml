name: Build and publish Containers

permissions:
  contents: write      # for committing VERSION bump
  packages: write      # for pushing to GHCR

on:
  push:
    paths:
      - "containers/**"
  workflow_dispatch:
    inputs:
      container:
        description: "Build a specific container (folder name)"
        required: false
      bump:
        description: "Bump version (major/minor)"
        required: false
        default: "minor"

# prevent concurrent version-bump commits
concurrency:
  group: container-version-bump
  cancel-in-progress: false

jobs:

  load-dockers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.load.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: load
        run: |
          # read lines, strip trailing commas/spaces, convert to compact JSON array
          list=$(
            sed 's/[[:space:]]*,[[:space:]]*$//' .github/workflows/dockers.txt \
            | jq -R . \
            | jq -sc .
          )
      
          echo "Loaded docker folders: $list"
          echo "list=$list" >> $GITHUB_OUTPUT


  detect-containers:
    runs-on: ubuntu-latest
    needs: load-dockers
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          # FIX 3: safer scripting
          set -eo pipefail

          # Manual override by workflow_dispatch
          if [ -n "${{ github.event.inputs.container }}" ]; then
            echo "changed=[\"${{ github.event.inputs.container }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi

          changed=()

          # Handle case where HEAD~1 does not exist (first commit in branch)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            base=HEAD~1
          else
            base=HEAD
          fi

          for c in $(echo '${{ needs.load-dockers.outputs.list }}' | jq -r '.[]'); do
            if ! git diff --quiet "$base" HEAD -- "containers/$c/Dockerfile"; then
              changed+=("$c")
            fi
          done

          changed_json=$(printf '%s\n' "${changed[@]}" | jq -R . | jq -s .)
          echo "changed=$changed_json" >> $GITHUB_OUTPUT


  build:
    runs-on: ubuntu-latest
    needs: detect-containers
    if: needs.detect-containers.outputs.changed != '[]'
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.changed) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FIX 6: add Buildx + build cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.container }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.container }}-

      - id: build_image
        run: |
          set -eo pipefail
          IMAGE="ghcr.io/$OWNER_LC/${{ matrix.container }}"

          # read version BEFORE build
          version_file="containers/${{ matrix.container }}/VERSION"
          version=$(cat "$version_file")

          docker build \
            --pull \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new \
            -f "containers/${{ matrix.container }}/Dockerfile" \
            -t "$IMAGE:$version" \
            -t "$IMAGE:latest" \
            .

          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Push image
        run: |
          IMAGE="ghcr.io/$OWNER_LC/${{ matrix.container }}"
          VERSION="${{ steps.build_image.outputs.version }}"

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      # FIX 4 + FIX 5:
      # move version bump AFTER pushing & avoid race by global concurrency above
      - id: bump
        run: |
          version_file="containers/${{ matrix.container }}/VERSION"
          version=$(cat "$version_file")

          IFS='.' read -r major minor <<< "$version"
          bump="${{ github.event.inputs.bump || 'minor' }}"

          case "$bump" in
            major) major=$((major+1)); minor=0 ;;
            minor) minor=$((minor+1)) ;;
          esac

          new="$major.$minor"
          echo "$new" > "$version_file"
          echo "new_version=$new" >> $GITHUB_OUTPUT

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump ${{ matrix.container }} to version ${{ steps.bump.outputs.new_version }}"
          file_pattern: "containers/${{ matrix.container }}/VERSION"

      # Replace old docker cache with new
      - name: Move updated Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
