name: Build alish Containers

on:
  # push:
  #   paths:
  #     - "containers/**"
  workflow_dispatch:
    inputs:
      container:
        description: "Build a specific container (folder name)"
        required: false
      bump:
        description: "Bump version (major/minor)"
        required: false
        default: "minor"

jobs:

  load-dockers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.load.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      # Read .github/workflows/dockers.txt into JSON list for later use
      - id: load
        run: |
          mapfile -t arr < .github/workflows/dockers.txt

          # convert to ["a","b","c"]
          json="[$(printf '"%s",' "${arr[@]}" | sed 's/,$//')]"

          echo "Loaded docker folders: $json"
          echo "list=$json" >> $GITHUB_OUTPUT


  detect-containers:
    runs-on: ubuntu-latest
    needs: load-dockers
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          if [ -n "${{ github.event.inputs.container }}" ]; then
            echo "changed=[\"${{ github.event.inputs.container }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi
      
          changed=()
      
          for c in $(echo '${{ needs.load-dockers.outputs.list }}' | jq -r '.[]'); do
            if ! git diff --quiet HEAD~1 HEAD -- "containers/$c/Dockerfile"; then
              changed+=("$c")
            fi
          done
      
          changed_json=$(printf '%s\n' "${changed[@]}" | jq -R . | jq -s .)
          echo "changed=$changed_json" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: detect-containers
    if: needs.detect-containers.outputs.changed != '[]'
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.changed) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: bump
        run: |
          version_file="containers/${{ matrix.container }}/VERSION"
          version=$(cat "$version_file")

          IFS='.' read -r major minor <<< "$version"
          bump="${{ github.event.inputs.bump || 'minor' }}"

          case "$bump" in
            major) major=$((major+1)); minor=0 ;;
            minor) minor=$((minor+1)) ;;
          esac

          new="$major.$minor"
          echo "$new" > "$version_file"
          echo "version=$new" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          IMAGE="ghcr.io/$OWNER_LC/${{ matrix.container }}"
          VERSION="${{ steps.bump.outputs.version }}"

          docker build \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            "containers/${{ matrix.container }}"

      - name: Push image
        run: |
          IMAGE="ghcr.io/$OWNER_LC/${{ matrix.container }}"
          VERSION="${{ steps.bump.outputs.version }}"

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump ${{ matrix.container }} to version ${{ steps.bump.outputs.version }}"
          file_pattern: "containers/${{ matrix.container }}/VERSION"

