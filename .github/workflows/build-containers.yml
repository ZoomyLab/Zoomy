name: Containers

permissions:
  contents: write
  packages: write

on:
  push:
    paths:
      - "containers/**"
  workflow_dispatch:
    inputs:
      container:
        description: "Build a specific container (folder name)"
        required: false
      bump:
        description: "Bump version (major/minor)"
        required: false
        default: "minor"

concurrency:
  group: container-version-bump
  cancel-in-progress: false


jobs:

  # ------------------------------------------------------------
  # Load list of container folders from dockers.txt
  # ------------------------------------------------------------
  load-dockers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.load.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: load
        run: |
          list=$(
            sed 's/[[:space:]]*,[[:space:]]*$//' .github/workflows/dockers.txt \
            | jq -R . | jq -sc .
          )
          echo "list=$list" >> $GITHUB_OUTPUT


  # ------------------------------------------------------------
  # Detect which containers changed
  # ------------------------------------------------------------
  detect-containers:
    runs-on: ubuntu-latest
    needs: load-dockers
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - id: detect
        run: |
          set -eo pipefail

          # Manual override
          if [ -n "${{ github.event.inputs.container }}" ]; then
            echo "changed=[\"${{ github.event.inputs.container }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi

          changed=()

          # Determine base commit safely
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            base=HEAD~1
          else
            base=HEAD
          fi

          for c in $(echo '${{ needs.load-dockers.outputs.list }}' | jq -r '.[]'); do
            if ! git diff --quiet "$base" HEAD -- "containers/$c/Dockerfile"; then
              changed+=("$c")
            fi
          done

          # Safe JSON (never [""], never null)
          if [ ${#changed[@]} -eq 0 ]; then
            json='[]'
          else
            json=$(printf '%s\n' "${changed[@]}" | jq -R . | jq -sc .)
          fi

          echo "changed=$json" >> $GITHUB_OUTPUT

      - name: Debug detected containers
        run: |
          echo "Detected containers: ${{ steps.detect.outputs.changed }}"


  # ------------------------------------------------------------
  # Build changed containers
  # ------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: detect-containers

    # Only run if there are containers to build
    # (array indexing is the ONLY valid way to check length)
    if: ${{ fromJson(needs.detect-containers.outputs.changed)[0] }}

    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.changed) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Debug folder tree
        run: |
          echo "ROOT:"
          ls -la .
          echo "CONTAINERS:"
          ls -la containers || echo "No containers folder"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Build the container
      # -------------------------
      - id: build_image
        run: |
          set -eo pipefail

          container="${{ matrix.container }}"
          version_file="containers/$container/VERSION"

          echo "Building container: $container"
          echo "Version file located at: $version_file"

          version=$(cat "$version_file")
          image="ghcr.io/$OWNER_LC/$container"

          docker build \
            --pull \
            -f "containers/$container/Dockerfile" \
            -t "$image:$version" \
            -t "$image:latest" \
            .

          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Push image
        run: |
          container="${{ matrix.container }}"
          version="${{ steps.build_image.outputs.version }}"
          image="ghcr.io/$OWNER_LC/$container"

          docker push "$image:$version"
          docker push "$image:latest"

      # -------------------------
      # Bump version after push
      # -------------------------
      - id: bump
        run: |
          container="${{ matrix.container }}"
          file="containers/$container/VERSION"
          old=$(cat "$file")

          IFS='.' read -r major minor <<< "$old"
          bump="${{ github.event.inputs.bump || 'minor' }}"

          case "$bump" in
            major) major=$((major+1)); minor=0 ;;
            minor) minor=$((minor+1)) ;;
          esac

          new="$major.$minor"
          echo "$new" > "$file"

          echo "new_version=$new" >> $GITHUB_OUTPUT

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump ${{ matrix.container }} to version ${{ steps.bump.outputs.new_version }}"
          file_pattern: "containers/${{ matrix.container }}/VERSION"
