name: Build and publish Containers

permissions:
  contents: write
  packages: write

on:
  push:
    paths:
      - "containers/**"
  workflow_dispatch:
    inputs:
      container:
        description: "Build a specific container (folder name)"
        required: false
      bump:
        description: "Bump version (major/minor)"
        required: false
        default: "minor"

# FIX 4+5: prevent simultaneous version bump commits
concurrency:
  group: container-version-bump
  cancel-in-progress: false

jobs:

  load-dockers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.load.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: load
        run: |
          # FIX 2: Robust JSON array generation (one-line compact JSON)
          list=$(
            sed 's/[[:space:]]*,[[:space:]]*$//' .github/workflows/dockers.txt \
            | jq -R . \
            | jq -sc .
          )
          echo "list=$list" >> $GITHUB_OUTPUT


  detect-containers:
    runs-on: ubuntu-latest
    needs: load-dockers
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          # FIX 3: safer scripting
          set -eo pipefail

          # manual override
          if [ -n "${{ github.event.inputs.container }}" ]; then
            echo "changed=[\"${{ github.event.inputs.container }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi

          changed=()

          # Safe fallback for HEAD~1 (first commit)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            base=HEAD~1
          else
            base=HEAD
          fi

          for c in $(echo '${{ needs.load-dockers.outputs.list }}' | jq -r '.[]'); do
            if ! git diff --quiet "$base" HEAD -- "containers/$c/Dockerfile"; then
              changed+=("$c")
            fi
          done

          json=$(printf '%s\n' "${changed[@]}" | jq -R . | jq -sc .)
          echo "changed=$json" >> $GITHUB_OUTPUT


  build:
    runs-on: ubuntu-latest
    needs: detect-containers
    if: needs.detect-containers.outputs.changed != '[]'
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.changed) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Debug root contents
        run: |
          echo "=== ROOT CONTENTS ==="
          ls -la .
          echo "=== library CONTENTS ==="
          ls -la library || echo "library not found"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the existing version (NO BUMP YET)
      - id: build_image
        run: |
          set -eo pipefail

          image="ghcr.io/$OWNER_LC/${{ matrix.container }}"

          version_file="containers/${{ matrix.container }}/VERSION"
          version=$(cat "$version_file")

          docker build \
            --pull \
            -f "containers/${{ matrix.container }}/Dockerfile" \
            -t "$image:$version" \
            -t "$image:latest" \
            .

          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Push image
        run: |
          image="ghcr.io/$OWNER_LC/${{ matrix.container }}"
          version="${{ steps.build_image.outputs.version }}"

          docker push "$image:$version"
          docker push "$image:latest"

      # FIX 4+5: Do version bump AFTER successful push
      - id: bump
        run: |
          version_file="containers/${{ matrix.container }}/VERSION"
          old=$(cat "$version_file")

          IFS='.' read -r major minor <<< "$old"
          bump="${{ github.event.inputs.bump || 'minor' }}"

          case "$bump" in
            major) major=$((major+1)); minor=0 ;;
            minor) minor=$((minor+1)) ;;
          esac

          new="$major.$minor"
          echo "$new" > "$version_file"

          echo "new_version=$new" >> $GITHUB_OUTPUT

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump ${{ matrix.container }} to version ${{ steps.bump.outputs.new_version }}"
          file_pattern: "containers/${{ matrix.container }}/VERSION"
