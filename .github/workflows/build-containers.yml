name: Containers

permissions:
  contents: write
  packages: write

on:
  push:
    paths:
      - "containers/**"
  workflow_dispatch:
    inputs:
      container:
        description: "Build a specific container (folder name)"
        required: false
      bump:
        description: "Bump version (major/minor)"
        required: false
        default: "minor"

concurrency:
  group: container-version-bump
  cancel-in-progress: false

jobs:

  load-dockers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.load.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: load
        run: |
          list=$(
            sed 's/[[:space:]]*,[[:space:]]*$//' .github/workflows/dockers.txt \
            | jq -R . \
            | jq -sc .
          )
          echo "list=$list" >> $GITHUB_OUTPUT


  detect-containers:
  runs-on: ubuntu-latest
  needs: load-dockers
  outputs:
    changed: ${{ steps.detect.outputs.changed }}
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        submodules: recursive

    - id: detect
      run: |
        # ... detection logic omitted ...
        echo "changed=$json" >> $GITHUB_OUTPUT

    - name: Debug detected containers
      run: echo "Detected containers: ${{ needs.detect-containers.outputs.changed }}"


  build:
    runs-on: ubuntu-latest
    needs: detect-containers
    if: ${{ fromJson(needs.detect-containers.outputs.changed).size() > 0 }}
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-containers.outputs.changed) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Debug root directories
        run: |
          echo "ROOT:"
          ls -la .
          echo "CONTAINERS:"
          ls -la containers || echo "no containers folder"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build_image
        run: |
          set -eo pipefail

          container="${{ matrix.container }}"
          image="ghcr.io/$OWNER_LC/$container"
          version_file="containers/$container/VERSION"

          echo "VERSION FILE = $version_file"
          cat "$version_file"

          version=$(cat "$version_file")

          docker build \
            --pull \
            -f "containers/$container/Dockerfile" \
            -t "$image:$version" \
            -t "$image:latest" \
            .

          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Push image
        run: |
          container="${{ matrix.container }}"
          image="ghcr.io/$OWNER_LC/$container"
          version="${{ steps.build_image.outputs.version }}"

          docker push "$image:$version"
          docker push "$image:latest"

      - id: bump
        run: |
          container="${{ matrix.container }}"
          version_file="containers/$container/VERSION"

          old=$(cat "$version_file")
          IFS='.' read -r major minor <<< "$old"
          bump="${{ github.event.inputs.bump || 'minor' }}"

          case "$bump" in
            major) major=$((major+1)); minor=0 ;;
            minor) minor=$((minor+1)) ;;
          esac

          new="$major.$minor"
          echo "$new" > "$version_file"

          echo "new_version=$new" >> $GITHUB_OUTPUT

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump ${{ matrix.container }} to version ${{ steps.bump.outputs.new_version }}"
          file_pattern: "containers/${{ matrix.container }}/VERSION"
