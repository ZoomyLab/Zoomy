name: Backend e2e

# tests/backend_e2e/README.md: the GUI sessions / solver cards through the backend containers'
# zoomy-server over the GUI's HTTP protocol, and a matrix subset inside the containers. The
# CPU images come from GHCR (docker, no apptainer); dev mode mounts this commit's library/
# into them. ci.yml calls it with the thesis-QR sessions of numpy, jax and amrex (openfoam
# too when zoomy_foam changed), weekly.yml with every backend and every session. By hand: any selection.
# The foam / AMReX matrix reference runs on the host through apptainer: not here (skipped).

on:
  workflow_call:
    inputs:
      mode:
        description: "dev (this commit's library mounted) | published (the images as they are)"
        type: string
        default: "dev"
      backends:
        description: "comma list of numpy, jax, amrex, openfoam"
        type: string
        default: "numpy,jax,amrex"
      qr_only:
        description: "only the sessions a thesis QR code opens (1) or everything (0)"
        type: string
        default: "1"
      select:
        description: "pytest -k expression (empty: all)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      mode:
        description: "dev (this commit's library mounted) | published (the images as they are)"
        default: "dev"
      backends:
        description: "comma list of numpy, jax, amrex, openfoam"
        default: "numpy,jax,amrex,openfoam"
      qr_only:
        description: "only the sessions a thesis QR code opens (1) or everything (0)"
        default: "0"
      select:
        description: "pytest -k expression (empty: all)"
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [ numpy, jax, amrex, openfoam ]
    env:
      E2E_RUNTIME: docker
      E2E_BACKENDS: ${{ matrix.backend }}
      E2E_MODE: ${{ inputs.mode || 'dev' }}
      E2E_QR_ONLY: ${{ inputs.qr_only }}
      E2E_SELECT: ${{ inputs.select }}
      OMP_NUM_THREADS: "1"
    steps:
      - name: Selected?
        id: on
        env:
          SELECTED: ${{ inputs.backends }}
        run: |
          case ",$SELECTED," in *",${{ matrix.backend }},"*) echo "run=1" >> "$GITHUB_OUTPUT" ;; *) echo "run=0" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/checkout@v5
        if: steps.on.outputs.run == '1'

      - name: Submodules the tests use
        if: steps.on.outputs.run == '1'
        run: git submodule update --init library/zoomy_foam library/zoomy_amrex library/zoomy_gui

      - uses: actions/setup-python@v6
        if: steps.on.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/qr_cases/requirements.txt

      - name: Host env (GUI-side checks, in-process and host matrix runs)
        if: steps.on.outputs.run == '1'
        run: python -m pip install -r tests/qr_cases/requirements.txt attrs

      - name: Pull the image
        if: steps.on.outputs.run == '1'
        run: |
          c=$(case "${{ matrix.backend }}" in numpy) echo zoomy_numpy;; jax) echo zoomy_jax;; amrex) echo zoomy_amrex;; openfoam) echo zoomy_openfoam;; esac)
          docker pull "ghcr.io/zoomylab/$c:latest"

      - name: Host JAX (jax job - the image's, the host-vs-container comparison is exact only on one JAX build)
        if: steps.on.outputs.run == '1'
        run: |
          # equinox: zoomy_jax's reverse AD (the host references of the AD matrix rows)
          if [ "${{ matrix.backend }}" = "jax" ]; then
            read -r v e < <(docker run --rm --entrypoint /opt/conda/envs/zoomy/bin/python \
                  ghcr.io/zoomylab/zoomy_jax:latest \
                  -c "import jax, equinox; print(jax.__version__, equinox.__version__)")
            echo "image JAX $v, equinox $e"
            python -m pip install "jax[cpu]==$v" "equinox==$e"
          else
            python -m pip install "jax[cpu]" equinox
          fi

      - name: Backend e2e
        if: steps.on.outputs.run == '1'
        run: |
          # exit 5 = nothing selected (a backend without QR sessions in QR-only mode): not a failure
          E2E_WORK="$RUNNER_TEMP/e2e" python -m pytest tests/backend_e2e -m backend_e2e \
            -k "$E2E_SELECT" -rA --tb=short -p no:cacheprovider || [ $? -eq 5 ]

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.on.outputs.run == '1' }}
        with:
          name: backend-e2e-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/e2e/report-*.json
            ${{ runner.temp }}/e2e/*/*/server-*.log
            ${{ runner.temp }}/e2e/*/*/matrix/*.log
          if-no-files-found: ignore
