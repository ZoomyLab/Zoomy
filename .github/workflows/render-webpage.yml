name: Render Webpage

permissions:
  contents: read
  packages: read
  actions: read     # Download Smart Tests artifacts from other workflow runs
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required to deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - "docs/**"
      - "library/zoomy_gui/**"
      - "library/zoomy_js/**"
      - "apps/swe-game/**"
      - "tutorials/**/*.ipynb"
      - "tests/reporting/**"
      - ".github/workflows/render-webpage.yml"
  workflow_run:
    workflows: [ "Smart Tests" ]
    types: [ completed ]
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this manual render"
        required: false
        default: ""
        type: string

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Manual render note
        if: github.event_name == 'workflow_dispatch' && inputs.note != ''
        run: |
          echo "Manual render note: ${{ inputs.note }}"
               
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docs image
        run: |
          IMAGE="ghcr.io/$OWNER_LC/zoomy_docs:latest"
          if docker pull "$IMAGE"; then
            echo "DOCS_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            echo "Prebuilt docs image not available. Building fallback image locally."
            docker build -f docs/Dockerfile.docs -t zoomy-docs:fallback .
            echo "DOCS_IMAGE=zoomy-docs:fallback" >> "$GITHUB_ENV"
          fi

      # Small vs large bundles are produced on different schedules; fetch each separately.
      - name: Download latest small-suite test reports
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: tests-report.yml
          workflow_conclusion: completed
          branch: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          name: test-reports-small-bundle
          path: artifacts/test-reports/small
          if_no_artifact_found: ignore

      - name: Download latest large-suite test reports
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: tests-report.yml
          workflow_conclusion: completed
          branch: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          name: test-reports-large-bundle
          path: artifacts/test-reports/large
          if_no_artifact_found: ignore

      - name: Build Jupyter Book in docs image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DOCS_IMAGE" \
            bash -lc "python docs/scripts/generate_ci_test_report.py && python docs/scripts/generate_apidoc.py && jupyter-book build docs/book"

      - name: Download mesh artifacts and generate GUI previews
        run: |
          # Fetch the latest mesh release from the meshes repo
          MESHES_REPO="${{ github.repository_owner }}/meshes"

          echo "Fetching latest mesh release assets..."
          mkdir -p meshes_download

          # Download .msh files from the meshes repo's latest release
          RELEASE_JSON=$(gh api "repos/${MESHES_REPO}/releases/latest" 2>/dev/null || echo '{}')
          if echo "$RELEASE_JSON" | jq -e '.assets' >/dev/null 2>&1; then
            for url in $(echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url // empty'); do
              fname=$(basename "$url")
              # Download every .msh including __coarse/__medium/__fine
              # size variants; generate_mesh_previews.py groups them and
              # populates each card's mesh_sizes array.
              if [[ "$fname" == *.msh ]]; then
                echo "  Downloading: $fname"
                curl -sL "$url" -o "meshes_download/$fname"
              fi
            done
          else
            echo "  No mesh release found, using local .msh files only"
          fi

          # Place every downloaded .msh flat under meshes/. We do NOT
          # convert __ → / — the build-meshes CI collapses directory
          # separators to single _ and uses __size only as the size
          # suffix (e.g. basic_shapes_quad_2d_hole_mesh__coarse.msh).
          # generate_mesh_previews.py::_parse_mesh_identity parses both
          # the category (by matching known-prefix heuristic) and the
          # size suffix from a flat filename, so we just let it walk
          # meshes/ as-is.
          mkdir -p meshes
          for f in meshes_download/*.msh; do
            [ -f "$f" ] || continue
            cp "$f" "meshes/$(basename "$f")"
          done
          echo "  Placed $(ls meshes/*.msh 2>/dev/null | wc -l) .msh files at meshes/"

          # Also copy any .msh files from the submodule checkout itself
          # (square/ has committed .msh files)
          echo "Checking submodule meshes..."
          find meshes/ -name '*.msh' 2>/dev/null | head -20

          # Generate mesh previews (force rebuild with all available .msh files)
          echo "Generating mesh preview SVGs..."
          pip install meshio matplotlib numpy
          cd library/zoomy_gui
          python generate_mesh_previews.py --force
          cd ../..

          echo "Mesh preview generation complete."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy GUI into docs site
        run: |
          sudo chown -R $(id -u):$(id -g) docs/book/_build/
          mkdir -p docs/book/_build/html/gui
          # Copy the submodule GUI first
          cp -r library/zoomy_gui/* docs/book/_build/html/gui/
          # Then overwrite with freshly generated cards + previews
          cp library/zoomy_gui/cards/meshes/generated.json docs/book/_build/html/gui/cards/meshes/generated.json
          cp -r library/zoomy_gui/previews/* docs/book/_build/html/gui/previews/ 2>/dev/null || true
          # Copy the isomorphic CLI package so the GUI can import it as
          # ./zoomy_cli/browser.mjs (see app.js). Strip node-only and
          # dev detritus to keep the deploy small.
          mkdir -p docs/book/_build/html/gui/zoomy_cli
          cp library/zoomy_cli/browser.mjs docs/book/_build/html/gui/zoomy_cli/
          cp library/zoomy_cli/node.mjs docs/book/_build/html/gui/zoomy_cli/
          cp library/zoomy_cli/package.json docs/book/_build/html/gui/zoomy_cli/
          cp -r library/zoomy_cli/src docs/book/_build/html/gui/zoomy_cli/

          # Write the real build version so users can see it in the footer
          GUI_COMMIT=$(git -C library/zoomy_gui rev-parse HEAD)
          BUILT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > docs/book/_build/html/gui/version.json <<EOF
          {"version": "gha-${{ github.run_number }}", "commit": "${GUI_COMMIT}", "built": "${BUILT}"}
          EOF
          echo "Built GUI version: ${GUI_COMMIT:0:7} at ${BUILT}"

          # Cleanup
          rm -f docs/book/_build/html/gui/.git
          rm -f docs/book/_build/html/gui/.gitignore
          rm -rf docs/book/_build/html/gui/__pycache__
          rm -f docs/book/_build/html/gui/generate_mesh_previews.py
          rm -f docs/book/_build/html/gui/generate_previews.py

      - name: Copy SWE game into docs site
        run: |
          # The game lives in apps/swe-game/; its module worker imports the
          # generic solver from library/zoomy_js/. Deploy both, mirroring the
          # repo layout so the worker's "../../library/zoomy_js/" import
          # resolves: game at /playground/swe-game/, solver at /library/zoomy_js/.
          mkdir -p docs/book/_build/html/playground/swe-game
          cp -r apps/swe-game/. docs/book/_build/html/playground/swe-game/
          # Drop dev-only bits from the deployed game.
          rm -rf docs/book/_build/html/playground/swe-game/test
          rm -f  docs/book/_build/html/playground/swe-game/generate.py
          rm -f  docs/book/_build/html/playground/swe-game/package.json
          mkdir -p docs/book/_build/html/library/zoomy_js
          cp library/zoomy_js/solver.js library/zoomy_js/model.js \
             docs/book/_build/html/library/zoomy_js/
          echo "Copied SWE game to /playground/swe-game/ (+ library/zoomy_js)"
          ls docs/book/_build/html/playground/swe-game/ | head

      - name: Build JupyterLite Pyodide deployment
        run: |
          # The "Run a notebook in your browser" card on the docs index
          # points at jupyter-lite/_output/lab/index.html?path=pyodide.ipynb.
          # The notebook's install cell does `%pip install -q zoomy-core`,
          # so it relies on PyPI carrying a version that matches the
          # APIs the notebook uses (NumericalSystemModel, etc.).
          pip install --quiet jupyterlite-core jupyterlite-pyodide-kernel jupyter-server
          jupyter lite build \
            --contents tutorials/pyodide \
            --output-dir docs/book/_build/html/jupyter-lite/_output
          ls docs/book/_build/html/jupyter-lite/_output/lab/ | head

      # CHANGED: Replaced upload-artifact with configure-pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # CHANGED: Use the official Pages artifact uploader
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/_build/html

  # NEW JOB: Actually deploys the uploaded artifact to the live website
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
