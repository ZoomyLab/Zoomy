name: Render Webpage

permissions:
  contents: read
  packages: read
  actions: read     # Download Smart Tests artifacts from other workflow runs
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required to deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - "docs/**"
      - "web/**"
      - "tutorials/**/*.ipynb"
      - "tests/reporting/**"
      - ".github/workflows/render-webpage.yml"
  workflow_run:
    workflows: [ "Smart Tests" ]
    types: [ completed ]
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this manual render"
        required: false
        default: ""
        type: string

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Manual render note
        if: github.event_name == 'workflow_dispatch' && inputs.note != ''
        run: |
          echo "Manual render note: ${{ inputs.note }}"
               
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docs image
        run: |
          IMAGE="ghcr.io/$OWNER_LC/zoomy_docs:latest"
          if docker pull "$IMAGE"; then
            echo "DOCS_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            echo "Prebuilt docs image not available. Building fallback image locally."
            docker build -f docs/Dockerfile.docs -t zoomy-docs:fallback .
            echo "DOCS_IMAGE=zoomy-docs:fallback" >> "$GITHUB_ENV"
          fi

      # Small vs large bundles are produced on different schedules; fetch each separately.
      - name: Download latest small-suite test reports
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: tests-report.yml
          workflow_conclusion: completed
          branch: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          name: test-reports-small-bundle
          path: artifacts/test-reports/small
          if_no_artifact_found: ignore

      - name: Download latest large-suite test reports
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: tests-report.yml
          workflow_conclusion: completed
          branch: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          name: test-reports-large-bundle
          path: artifacts/test-reports/large
          if_no_artifact_found: ignore

      - name: Build Jupyter Book in docs image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DOCS_IMAGE" \
            bash -lc "python docs/scripts/generate_ci_test_report.py && python docs/scripts/generate_apidoc.py && jupyter-book build docs/book"

      # CHANGED: Replaced upload-artifact with configure-pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # CHANGED: Use the official Pages artifact uploader
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/_build/html

  # NEW JOB: Actually deploys the uploaded artifact to the live website
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
