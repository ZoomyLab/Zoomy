name: Render Webpage

permissions:
  contents: read
  packages: read
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required to deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - "docs/**"
      - "library/zoomy_gui/**"
      # Bare gitlink too: a submodule bump changes only the pointer entry
      # `library/zoomy_gui`, which the `/**` glob (it needs a path segment
      # after the slash) never matches — so bumps would not trigger a deploy.
      - "library/zoomy_gui"
      # The deploy VENDORS zoomy_cli into the site (it copies
      # library/zoomy_cli/src into gui/gui/zoomy_cli/ below), so that package is
      # part of what gets served -- but it was not a trigger. A CLI change could
      # land on main while the deployed GUI kept the old bundle. That is not
      # hypothetical: the coupling-folder payload lived in zoomy_cli and stayed
      # undeployed, so "Run coupled" posted no files and /couple answered 400
      # until this was dispatched by hand.
      - "library/zoomy_cli/**"
      - "library/zoomy_js/**"
      # The API reference is written from the docstrings of these libraries, so a
      # submodule bump (a bare gitlink change, see zoomy_gui above) re-renders it.
      - "library/zoomy_core"
      - "library/zoomy_jax"
      - "library/zoomy_foam"
      - "library/zoomy_amrex"
      # Served as a wheel the GUI's workers install (gui/gui/wheels/).
      - "library/zoomy_plotting/**"
      - "apps/swe-game/**"
      - "apps/baukasten-preview/**"
      - "tutorials/**/*.ipynb"
      - "tests/results/symsolver/**"
      - ".github/workflows/render-webpage.yml"
  # 2026-10-13: no longer chained to Smart Tests (disabled); push + manual only.
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this manual render"
        required: false
        default: ""
        type: string

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Manual render note
        if: github.event_name == 'workflow_dispatch' && inputs.note != ''
        run: |
          echo "Manual render note: ${{ inputs.note }}"
               
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The prebuilt image (docs-image.yml pushes it when docs/Dockerfile.docs or
      # docs/requirements-docs.txt change on main) is used only if it was built from
      # the very files of this checkout.  docs-image.yml and this workflow start on
      # the same push, so `latest` can still be the previous image, without a new
      # dependency of the build (sphinx-autodoc2, ...): then build it here.
      - name: Pull docs image (or build it when stale)
        run: |
          IMAGE="ghcr.io/$OWNER_LC/zoomy_docs:latest"
          fresh=no
          if docker pull "$IMAGE"; then
            if docker run --rm "$IMAGE" cat /opt/docs-image/Dockerfile.docs | cmp -s - docs/Dockerfile.docs \
               && docker run --rm "$IMAGE" cat /opt/docs-image/requirements-docs.txt | cmp -s - docs/requirements-docs.txt; then
              fresh=yes
            fi
          fi
          if [ "$fresh" = yes ]; then
            echo "DOCS_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            echo "Prebuilt docs image missing or stale. Building it from docs/Dockerfile.docs."
            docker build -f docs/Dockerfile.docs -t zoomy-docs:fallback .
            echo "DOCS_IMAGE=zoomy-docs:fallback" >> "$GITHUB_ENV"
          fi

      # The site is built here, from the checkout, and nowhere else: no built or
      # generated page (docs/_generated, docs/book/api/_autodoc2, docs/book/_build)
      # is committed.  Every generator runs offline and without the solvers; the
      # API pages are read from the library sources by sphinx-autodoc2, and the
      # results pages from the committed tests/results/symsolver/*.json.
      - name: Build Jupyter Book in docs image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e PYTHONPATH=/workspace/library/zoomy_core:/workspace/library/zoomy_jax:/workspace/library/zoomy_foam:/workspace/library/zoomy_amrex \
            "$DOCS_IMAGE" \
            bash -lc "python docs/scripts/generate_symsolver_results.py && python docs/scripts/generate_tutorial_index.py && python docs/scripts/collect_references.py --check && python docs/scripts/generate_apidoc.py && jupyter-book build docs/book"

      # NOTE: mesh cards are an AUTHORED registry now (cards/meshes/default.json,
      # hand-curated). CI no longer downloads release .msh files or regenerates
      # mesh previews/cards. Mesh files are served on demand from the meshes-repo
      # Pages (zoomylab.github.io/meshes/), which the GUI's fetch-or-load mesh
      # cells and exported notebooks use directly — the GUI deploy needs no
      # local .msh at all.

      # THE GUI. `library/zoomy_gui` is a browser-only Eclipse Theia: `theia
      # build --mode production` webpacks package.json into lib/frontend as a
      # static site with no backend, and its assets are relative so it mounts
      # fine under /Zoomy/gui/.
      #
      # This step used to `cp` a hand-written index.html/app.js GUI verbatim.
      # That GUI is gone (tag `pre-theia-gui-migration` is the last commit that
      # had it) and Theia replaced it in place, so this is now a real build.
      # BLOCKING on purpose: the GUI is the primary product surface here, and a
      # silently-skipped build would deploy a site whose /gui/ link 404s.
      - name: Build GUI (Theia) into docs site
        run: |
          sudo chown -R $(id -u):$(id -g) docs/book/_build/
          # One recipe for the deploy and tests/qr_cases/test_qr_browser.py (the QR notebooks
          # in a browser, against a local build of exactly this): the Theia app, the GUI
          # "brain" under gui/gui/, this commit's zoomy_core / zoomy_plotting wheels, the
          # mirrored release data, sw.js, the CLI package, version.json.
          /usr/bin/python3 -m venv .wheelvenv
          WHEEL_PYTHON=.wheelvenv/bin/python GUI_BUILD_VERSION="gha-${{ github.run_number }}" \
            docs/scripts/build_gui_site.sh docs/book/_build/html

      - name: Copy SWE game into docs site
        run: |
          # The game lives in apps/swe-game/; its module worker imports the
          # generic solver from library/zoomy_js/. Deploy both, mirroring the
          # repo layout so the worker's "../../library/zoomy_js/" import
          # resolves: game at /playground/swe-game/, solver at /library/zoomy_js/.
          mkdir -p docs/book/_build/html/playground/swe-game
          cp -r apps/swe-game/. docs/book/_build/html/playground/swe-game/
          # Drop dev-only bits from the deployed game.
          rm -rf docs/book/_build/html/playground/swe-game/test
          rm -f  docs/book/_build/html/playground/swe-game/generate.py
          rm -f  docs/book/_build/html/playground/swe-game/package.json
          mkdir -p docs/book/_build/html/library/zoomy_js
          cp library/zoomy_js/solver.js library/zoomy_js/model.js \
             docs/book/_build/html/library/zoomy_js/
          echo "Copied SWE game to /playground/swe-game/ (+ library/zoomy_js)"
          ls docs/book/_build/html/playground/swe-game/ | head

      # WIP: a backend-less Baukasten (TypeFox) GUI preview, deployed to
      # /baukasten-preview/ and linked from no page. Runs
      # on the ubuntu runner's Node (not the docs container). NON-BLOCKING: a
      # failure here must never break the site deploy — it is an experiment.
      - name: Build Baukasten preview (WIP, non-blocking)
        continue-on-error: true
        run: |
          cd apps/baukasten-preview
          npm ci --no-audit --no-fund
          npm run build
          cd ../..
          mkdir -p docs/book/_build/html/baukasten-preview
          cp -r apps/baukasten-preview/dist/. docs/book/_build/html/baukasten-preview/
          echo "Copied Baukasten preview to /baukasten-preview/"
          ls docs/book/_build/html/baukasten-preview/ | head

      # /theia-preview/ was where the Theia GUI lived while it was an experiment
      # alongside the old GUI. It is now THE GUI and ships at /gui/ (above), so
      # this path only exists to keep already-published links alive: the desktop
      # wrappers (apps/electron-app, apps/vscode-ext) and any bookmark still
      # point here. Redirect rather than delete — a 404 is a worse answer than a
      # hop. Safe to drop once the wrappers have shipped a version using /gui/.
      - name: Redirect legacy /theia-preview/ to /gui/
        run: |
          mkdir -p docs/book/_build/html/theia-preview
          cat > docs/book/_build/html/theia-preview/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Moved to /gui/</title>
          <meta http-equiv="refresh" content="0; url=../gui/">
          <link rel="canonical" href="../gui/">
          <p>The Theia preview is now the Zoomy GUI and has moved to
             <a href="../gui/">/gui/</a>.</p>
          EOF
          echo "Wrote /theia-preview/ -> /gui/ redirect"

      - name: Build JupyterLite Pyodide deployment
        run: |
          # The "Run a notebook in your browser" card on the docs index
          # points at jupyter-lite/_output/lab/index.html?path=pyodide.ipynb.
          # The lite dir docs/jupyterlite configures:
          #  - PyodideLockAddon (the [lock] extra, uv-based): locks zoomy-core
          #    + deps into the kernel so `import zoomy_core` works AT STARTUP
          #    (no %pip / micropip cell; param+loguru wheels bundled, numpy/
          #    sympy/scipy from the pyodide CDN; overrides.txt relaxes sympy's
          #    stale mpmath<1.4 pin against pyodide's mpmath).
          #    zoomy-core / zoomy-plotting are this commit's wheels
          #    (build_gui_wheels.py -> docs/jupyterlite/wheels), not PyPI's: the
          #    notebook runs zoomy_core.symsolver, which a PyPI release can lag.
          #  - contentsStorageName "zoomy-jupyterlite-<hash>": JupyterLite copies
          #    notebooks into IndexedDB on first open and the LOCAL copy then wins
          #    forever, so a redeploy silently kept serving the old notebook (a
          #    stale `zoomy_core.model.models.system_model` import kept 404-ing in
          #    users' browsers long after it was fixed on main). The name carries a
          #    hash of tutorials/pyodide, so the store is invalidated exactly when
          #    the notebooks change and is stable otherwise.
          # cd matters: uv resolves the relative --override in the build cwd.
          #
          # PYTHON PIN: jupyterlite-core 0.8 SILENTLY drops all federated
          # extensions (=> no pyodide kernel, "No Kernel" only) when built on
          # Python 3.14 — verified: identical packages, 3.12 build carries
          # @jupyterlite/pyodide-kernel-extension, 3.14 build yields
          # federated_extensions: []. Build in a venv on the runner's system
          # python3 (3.12 on ubuntu-24.04), independent of any setup-python.
          /usr/bin/python3 -m venv .litevenv
          .litevenv/bin/pip install --quiet "jupyterlite-core==0.8.*" \
            "jupyterlite-pyodide-kernel[lock]==0.8.*" jupyter-server
          .litevenv/bin/python docs/scripts/build_gui_wheels.py docs/jupyterlite/wheels
          # Bust the IndexedDB contents store whenever the notebooks change.
          LITE_HASH=$(find tutorials/pyodide -type f -name '*.ipynb' -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          echo "JupyterLite contents hash: $LITE_HASH"
          python3 - "$LITE_HASH" <<'JSON'
          import json, sys
          p = 'docs/jupyterlite/jupyter-lite.json'
          cfg = json.load(open(p))
          cfg['jupyter-config-data']['contentsStorageName'] = f"zoomy-jupyterlite-{sys.argv[1]}"
          json.dump(cfg, open(p, 'w'), indent=2)
          print('contentsStorageName ->', cfg['jupyter-config-data']['contentsStorageName'])
          JSON
          cd docs/jupyterlite
          ../../.litevenv/bin/jupyter lite build \
            --contents ../../tutorials/pyodide \
            --output-dir ../book/_build/html/jupyter-lite/_output
          cd ../..
          ls docs/book/_build/html/jupyter-lite/_output/lab/ | head
          # HARD gates — fail the deploy rather than ship a kernel-less Lite:
          # kernel extension registered + lock assets + pinned storage name +
          # zoomy-core from this commit's wheel.
          python3 - <<'EOF'
          import json
          cfg = json.load(open('docs/book/_build/html/jupyter-lite/_output/jupyter-lite.json'))['jupyter-config-data']
          names = [e['name'] for e in cfg.get('federated_extensions', [])]
          assert '@jupyterlite/pyodide-kernel-extension' in names, f"pyodide kernel extension MISSING: {names}"
          assert cfg.get('contentsStorageName', '').startswith('zoomy-jupyterlite-'), cfg.get('contentsStorageName')
          lock = json.load(open('docs/book/_build/html/jupyter-lite/_output/static/pyodide-lock/pyodide-lock.json'))
          core = lock['packages']['zoomy-core']
          wheel = json.load(open('docs/jupyterlite/wheels/index.json'))['zoomy-core']
          assert core['sha256'] == wheel['sha256'], f"zoomy-core in the lock is {core['file_name']}, not {wheel['wheel']}"
          print('lite build OK — federated_extensions:', names)
          EOF
          ls docs/book/_build/html/jupyter-lite/_output/static/pyodide-lock/ | head

      # CHANGED: Replaced upload-artifact with configure-pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      # CHANGED: Use the official Pages artifact uploader
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/_build/html

  # NEW JOB: Actually deploys the uploaded artifact to the live website
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    # Two pushes in quick succession: deploys run one after the other (Pages refuses a second one in flight).
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The thesis's printed QR codes, against the site just deployed
  # (tests/qr_cases/test_qr_live.py): every manifest URL answers 200, every project zip
  # is served with the repo's file list (qr_live), and the GUI serves this commit's
  # wheels and the mirrored session data (qr_deploy). A broken QR target fails this workflow.
  qr-live:
    name: QR targets live
    needs: deploy-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: GUI submodule (the project zips to compare)
        run: git submodule update --init library/zoomy_gui
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: QR targets on the live site
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests/qr_cases -m "qr_live or qr_deploy" -rA --tb=short -p no:cacheprovider

  # The QR notebooks in a real browser on the site just deployed: headless Chromium opens every
  # QR code that loads a GUI session in the notebook view, Run All twice, a final cell judges
  # the run (tests/qr_cases/test_qr_browser.py). After qr-live, which waits until the Pages CDN
  # serves this commit's wheels.
  qr-browser-live:
    name: QR notebooks in the browser (live)
    needs: qr-live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: GUI submodule (the sessions to compose)
        run: git submodule update --init library/zoomy_gui
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: QR notebooks on the live site
        run: |
          python -m pip install pytest pytest-xdist pyyaml playwright
          python -m playwright install --with-deps chromium
          QR_GUI_BASE=https://zoomylab.github.io/Zoomy QR_STRICT=1 python -m pytest tests/qr_cases \
            -m qr_browser -n 3 -rA --tb=short -p no:cacheprovider
