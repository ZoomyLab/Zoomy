name: GUI grep-gate

# Phase-3 exit criterion: the GUI must talk to backends only through
# the ZoomyCLI façade. This job fails if app.js regresses to any of:
#   - direct Pyodide Worker access  (_pyWorker, postMessage(cmd:...))
#   - the legacy ZoomyBackend helper (we deleted backend.js)
#   - inline fetch() calls against backend URLs
# Keeps the refactor honest when future PRs are tempted to "just
# use fetch() this one time".

on:
  pull_request:
    paths:
      - "library/zoomy_gui/**"
      - ".github/workflows/gui-grep-gate.yml"
  push:
    branches: [ main, develop ]
    paths:
      - "library/zoomy_gui/**"
      - ".github/workflows/gui-grep-gate.yml"

env:
  # Opt JS actions onto Node 24 ahead of the 2026-06-16 default switch
  # (clears the Node 20 deprecation warnings; no action-version bump).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  grep-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Forbidden symbols in library/zoomy_gui/app.js
        run: |
          set -e
          # Strip JS comments before grepping. Preserves newlines so
          # the grep -n line numbers still point at the original file.
          # Handles /* ... */ blocks (multi-line, including continuation
          # lines without a `*` prefix) and // line comments.
          python3 - <<'PY' > /tmp/app-nocomments.js
          import re, pathlib
          src = pathlib.Path("library/zoomy_gui/app.js").read_text()
          src = re.sub(r"/\*.*?\*/",
                       lambda m: "\n" * m.group(0).count("\n"),
                       src, flags=re.S)
          src = re.sub(r"//[^\n]*", "", src)
          print(src, end="")
          PY
          FORBIDDEN=(
            'ZoomyBackend'
            '_pyWorker\.postMessage'
            '_pyWorker\.addEventListener'
            '_pyWorker\.terminate'
            '\bpyCall\s*\('
            'new Worker\('
            'fetch\("https'
          )
          FAIL=0
          for pat in "${FORBIDDEN[@]}"; do
            MATCHES=$(grep -nE "$pat" /tmp/app-nocomments.js || true)
            if [ -n "$MATCHES" ]; then
              echo "::error ::Forbidden pattern /$pat/ found in app.js:"
              echo "$MATCHES"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Phase 3 migration contract: every backend interaction"
            echo "must go through the CLI. See library/zoomy_cli/ and"
            echo "plan curious-yawning-wilkes.md for the rationale."
            exit 1
          fi
          echo "OK: app.js is clean."

      - name: backend.js must not return
        run: |
          if [ -f library/zoomy_gui/backend.js ]; then
            echo "::error ::backend.js was re-added. Delete it — the CLI owns backend interactions now."
            exit 1
          fi
          echo "OK: backend.js stays deleted."
