name: Smart Tests

# Scope (user ruling, 2026-07-22): we test FOUR stacks — zoomy_core, zoomy_jax,
# zoomy_amrex, zoomy_foam. dmplex / firedrake / fenicsx are out of CI scope.
#
# Tiering:
#   small tier -> every push and PR. This is a REAL GATE: a failing test fails
#                 the job. (Every job previously passed --ignore-pytest-exit-code,
#                 so no test could ever fail CI.)
#   large tier -> weekly (Sun 03:00 UTC) + manual. Covers the large, benchmark
#                 and regression markers.
#
# Every job runs inside the GHCR container for its stack and pip-installs the
# checked-out tree over it, so reports match the commit under test.
#
# Interpreter differs per image: the core/jax images are python:3.11-slim /
# conda based (`python`, no PEP 668); the amrex/foam images are Ubuntu system
# python (`python3`, needs --break-system-packages). Hence the matrix `py` and
# `pipflags` entries — do not collapse them.
#
# library/* are git submodules; checkout must init them or pip -e fails.

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/tests-report.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/tests-report.yml"
  workflow_dispatch:
    inputs:
      run_large:
        description: "Also run the large/benchmark/regression suite"
        required: false
        default: "false"
  # After a successful Containers build, re-run on the same commit so GHCR
  # :latest matches this tree.
  workflow_run:
    workflows: [ "Containers" ]
    types: [ completed ]
  schedule:
    - cron: "0 3 * * 0"   # weekly large/regression run, Sunday 03:00 UTC

jobs:
  meta:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      checkout_ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- small tier
  small:
    name: small · ${{ matrix.stack }}
    needs: [meta]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: core
            image: zoomy_core
            py: python
            pipflags: ""
            installs: "-e library/zoomy_core"
            paths: "tests library/zoomy_core/tests"
            markers: "small and (core or (numpy and not jax))"
          - stack: jax
            image: zoomy_jax
            py: python
            pipflags: ""
            installs: "-e library/zoomy_core -e library/zoomy_jax"
            paths: "tests library/zoomy_jax/tests"
            markers: "small and jax"
          - stack: amrex
            image: zoomy_amrex
            py: python3
            pipflags: "--break-system-packages"
            installs: "-e library/zoomy_core -e library/zoomy_amrex"
            paths: "tests library/zoomy_amrex/tests"
            markers: "small and amrex"
          - stack: foam
            image: zoomy_openfoam
            py: python3
            pipflags: "--break-system-packages"
            installs: "-e library/zoomy_core -e library/zoomy_foam"
            paths: "tests library/zoomy_foam/tests"
            markers: "small and openfoam"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive

      - id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ${{ matrix.image }}
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/${{ matrix.image }}:latest"

      # No --ignore-pytest-exit-code: this tier gates. --allow-no-tests is kept
      # so a stack with zero matching tests is not a failure.
      - name: Run ${{ matrix.stack }} small suite
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/${{ matrix.image }}:latest" \
            bash -lc '${{ matrix.py }} -m pip install --no-cache-dir -q ${{ matrix.pipflags }} ${{ matrix.installs }} && \
              ${{ matrix.py }} tests/reporting/generate_test_report.py \
                --markers "${{ matrix.markers }}" \
                --pytest-paths "${{ matrix.paths }}" \
                --allow-no-tests \
                --output-dir artifacts/test-reports/small/${{ matrix.stack }}'

      - name: Upload ${{ matrix.stack }} small report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-small-${{ matrix.stack }}
          path: artifacts/test-reports/small/${{ matrix.stack }}/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------- large tier
  large:
    name: large · ${{ matrix.stack }}
    needs: [meta]
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: core
            image: zoomy_core
            py: python
            pipflags: ""
            installs: "-e library/zoomy_core"
            paths: "tests library/zoomy_core/tests"
            markers: "(large or benchmark or regression) and (core or (numpy and not jax))"
          - stack: jax
            image: zoomy_jax
            py: python
            pipflags: ""
            installs: "-e library/zoomy_core -e library/zoomy_jax"
            paths: "tests library/zoomy_jax/tests"
            markers: "(large or benchmark or regression) and jax"
          - stack: amrex
            image: zoomy_amrex
            py: python3
            pipflags: "--break-system-packages"
            installs: "-e library/zoomy_core -e library/zoomy_amrex"
            paths: "tests library/zoomy_amrex/tests"
            markers: "(large or benchmark or regression) and amrex"
          - stack: foam
            image: zoomy_openfoam
            py: python3
            pipflags: "--break-system-packages"
            installs: "-e library/zoomy_core -e library/zoomy_foam"
            paths: "tests library/zoomy_foam/tests"
            markers: "(large or benchmark or regression) and openfoam"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive

      - id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ${{ matrix.image }}
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/${{ matrix.image }}:latest"

      - name: Run ${{ matrix.stack }} large suite
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/${{ matrix.image }}:latest" \
            bash -lc '${{ matrix.py }} -m pip install --no-cache-dir -q ${{ matrix.pipflags }} ${{ matrix.installs }} && \
              ${{ matrix.py }} tests/reporting/generate_test_report.py \
                --markers "${{ matrix.markers }}" \
                --pytest-paths "${{ matrix.paths }}" \
                --run-large --run-benchmark \
                --allow-no-tests \
                --output-dir artifacts/test-reports/large/${{ matrix.stack }}'

      - name: Upload ${{ matrix.stack }} large report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-${{ matrix.stack }}
          path: artifacts/test-reports/large/${{ matrix.stack }}/**
          if-no-files-found: ignore

  # --------------------------------------------------------------- aggregation
  # Render Webpage downloads these two bundles BY NAME to build the CI report
  # page, so test-reports-{small,large}-bundle are load-bearing.
  bundle:
    name: Bundle ${{ matrix.tier }}-suite reports
    needs: [small, large]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [small, large]
    steps:
      - name: Download ${{ matrix.tier }} reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-report-${{ matrix.tier }}-*
          path: staging

      # download-artifact names each directory after the artifact; the docs
      # generator expects <tier>/<stack>/.
      - name: Reshape into ${{ matrix.tier }}/<stack>/
        run: |
          mkdir -p "artifacts/test-reports/${{ matrix.tier }}"
          for d in staging/test-report-${{ matrix.tier }}-*; do
            [ -d "$d" ] || continue
            stack="${d##*-}"
            mv "$d" "artifacts/test-reports/${{ matrix.tier }}/$stack"
          done

      - id: check
        run: |
          if find "artifacts/test-reports/${{ matrix.tier }}" -name report.html -print -quit | grep -q .; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ${{ matrix.tier }}-suite bundle
        if: steps.check.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.tier }}-bundle
          path: artifacts/test-reports/${{ matrix.tier }}
