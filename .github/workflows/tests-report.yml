name: Smart Tests

# Library packages under library/* are git submodules; checkout must initialize them or pip -e fails.
permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - ".github/workflows/tests-report.yml"
  workflow_dispatch:
    inputs:
      run_large:
        description: "Also run large/benchmark test suite"
        required: false
        default: "false"
  pull_request:
    branches: [ main ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - ".github/workflows/tests-report.yml"
  # After a successful Containers build, re-run Smart Tests on the same commit so GHCR :latest matches this tree.
  workflow_run:
    workflows: [ "Containers" ]
    types:
      - completed
  schedule:
    # Weekly large/benchmark run (Sunday 03:00 UTC)
    - cron: "0 3 * * 0"

jobs:
  meta:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      checkout_ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  changes:
    needs: [meta]
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{ needs.meta.outputs.checkout_ref }}
      core: ${{ github.event_name == 'pull_request' && steps.filter.outputs.core || steps.defaults.outputs.core }}
      jax: ${{ github.event_name == 'pull_request' && steps.filter.outputs.jax || steps.defaults.outputs.jax }}
      amrex: ${{ github.event_name == 'pull_request' && steps.filter.outputs.amrex || steps.defaults.outputs.amrex }}
      dmplex: ${{ github.event_name == 'pull_request' && steps.filter.outputs.dmplex || steps.defaults.outputs.dmplex }}
      fenicsx: ${{ github.event_name == 'pull_request' && steps.filter.outputs.fenicsx || steps.defaults.outputs.fenicsx }}
      firedrake: ${{ github.event_name == 'pull_request' && steps.filter.outputs.firedrake || steps.defaults.outputs.firedrake }}
      infra: ${{ github.event_name == 'pull_request' && steps.filter.outputs.infra || steps.defaults.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            core:
              - 'library/zoomy_core/**'
              - 'tests/unit/zoomy_core/**'
              - 'tests/regression/zoomy_core/**'
              - 'tests/scripts/**'
              - 'tutorials/swe/**'
              - 'tutorials/poisson/**'
            jax:
              - 'library/zoomy_jax/**'
              - 'tests/unit/zoomy_jax/**'
              - 'tests/regression/zoomy_jax/**'
              - 'tests/benchmarks/zoomy_jax/**'
              - 'tests/scripts/**'
            amrex:
              - 'library/zoomy_amrex/**'
              - 'tests/unit/zoomy_amrex/**'
              - 'tests/regression/zoomy_amrex/**'
              - 'tests/benchmarks/zoomy_amrex/**'
              - 'tutorials/amrex/**'
            dmplex:
              # Bare path: submodule gitlink-only bumps do not match library/zoomy_dmplex/**
              - 'library/zoomy_dmplex'
              - 'library/zoomy_dmplex/**'
              - 'tests/unit/zoomy_dmplex/**'
              - 'tests/regression/zoomy_dmplex/**'
              - 'tests/benchmarks/zoomy_dmplex/**'
              - 'tutorials/dmplex/**'
            fenicsx:
              - 'library/zoomy_fenicsx/**'
              - 'tests/unit/zoomy_fenicsx/**'
              - 'tests/regression/zoomy_fenicsx/**'
              - 'tests/benchmarks/zoomy_fenicsx/**'
              - 'tutorials/dolfinx/**'
            firedrake:
              - 'library/zoomy_firedrake/**'
              - 'library/firedrake_animate/**'
              - 'tests/unit/zoomy_firedrake/**'
              - 'tests/regression/zoomy_firedrake/**'
              - 'tests/benchmarks/zoomy_firedrake/**'
              - 'tutorials/firedrake/**'
            infra:
              - 'pytest.ini'
              - 'tests/conftest.py'
              - 'tests/reporting/**'
              - '.github/workflows/tests-report.yml'
              - 'containers/**'
              - 'install/**'
              - '.github/workflows/build-containers.yml'
              - '.github/workflows/dockers.txt'
      - id: defaults
        if: github.event_name != 'pull_request'
        run: |
          echo "core=true" >> "$GITHUB_OUTPUT"
          echo "jax=true" >> "$GITHUB_OUTPUT"
          echo "amrex=true" >> "$GITHUB_OUTPUT"
          echo "dmplex=true" >> "$GITHUB_OUTPUT"
          echo "fenicsx=true" >> "$GITHUB_OUTPUT"
          echo "firedrake=true" >> "$GITHUB_OUTPUT"
          echo "infra=true" >> "$GITHUB_OUTPUT"

  tests-core:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.git_ref }}
          submodules: recursive

      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull zoomy_core image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_core:latest"

      - name: Generate core report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_core:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core && python tests/reporting/generate_test_report.py \
              --markers "small and (core or (numpy and not jax))" \
              --pytest-paths "tests library/zoomy_core/tests" \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/core'

      - name: Upload core report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-core
          path: artifacts/test-reports/core/**
          if-no-files-found: ignore

  tests-jax:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.jax == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.git_ref }}
          submodules: recursive

      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull zoomy_jax image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_jax:latest"

      - name: Generate jax report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_jax:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core -e library/zoomy_jax && python tests/reporting/generate_test_report.py \
              --markers "small and jax" \
              --pytest-paths "tests library/zoomy_jax/tests" \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/jax'

      - name: Upload jax report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-jax
          path: artifacts/test-reports/jax/**
          if-no-files-found: ignore

  tests-amrex:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.amrex == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.git_ref }}
          submodules: recursive

      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull AMReX placeholder image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_amrex_dummy:latest"

      - name: Generate amrex report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_amrex_dummy:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core -e library/zoomy_amrex && python tests/reporting/generate_test_report.py \
              --markers "small and amrex" \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/amrex'

      - name: Upload amrex report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-amrex
          path: artifacts/test-reports/amrex/**
          if-no-files-found: ignore

  # DMPlex + Firedrake share one runner install; FEniCSx is a separate job (different stack).
  tests-dmplex-firedrake:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.dmplex == 'true' || needs.changes.outputs.firedrake == 'true' ||
        needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.git_ref }}
          submodules: recursive

      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull zoomy_firedrake image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_firedrake:latest"

      - name: Generate DMPlex and Firedrake reports
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_firedrake:latest" \
            bash -lc 'python3 -m pip install --no-cache-dir -q -e library/zoomy_core -e library/firedrake_animate -e library/zoomy_firedrake && \
              ( python3 tests/reporting/generate_test_report.py \
                  --markers "small and dmplex" \
                  --ignore-pytest-exit-code \
                  --allow-no-tests \
                  --output-dir artifacts/test-reports/dmplex; \
                python3 tests/reporting/generate_test_report.py \
                  --markers "small and firedrake" \
                  --ignore-pytest-exit-code \
                  --allow-no-tests \
                  --output-dir artifacts/test-reports/firedrake )'

      - name: Upload DMPlex report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-dmplex
          path: artifacts/test-reports/dmplex/**
          if-no-files-found: ignore

      - name: Upload Firedrake report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-firedrake
          path: artifacts/test-reports/firedrake/**
          if-no-files-found: ignore

  tests-fenicsx:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.fenicsx == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.git_ref }}
          submodules: recursive

      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull FEniCSx placeholder image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_fenicsx_dummy:latest"

      - name: Generate FEniCSx report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_fenicsx_dummy:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core && if [ -f library/zoomy_fenicsx/pyproject.toml ]; then python -m pip install --no-cache-dir -q -e library/zoomy_fenicsx; fi && python tests/reporting/generate_test_report.py \
              --markers "small and fenicsx" \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/fenicsx'

      - name: Upload FEniCSx report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-fenicsx
          path: artifacts/test-reports/fenicsx/**
          if-no-files-found: ignore

  tests-large-core:
    needs: [meta]
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive
      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull zoomy_core image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_core:latest"
      - name: Generate large core report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_core:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core && python tests/reporting/generate_test_report.py \
              --markers "(large or benchmark) and (core or (numpy and not jax))" \
              --pytest-paths "tests library/zoomy_core/tests" \
              --run-large \
              --run-benchmark \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/large-core'
      - name: Upload large core report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-core
          path: artifacts/test-reports/large-core/**
          if-no-files-found: ignore

  tests-large-jax:
    needs: [meta]
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive
      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull zoomy_jax image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_jax:latest"
      - name: Generate large jax report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_jax:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core -e library/zoomy_jax && python tests/reporting/generate_test_report.py \
              --markers "(large or benchmark) and jax" \
              --pytest-paths "tests library/zoomy_jax/tests" \
              --run-large \
              --run-benchmark \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/large-jax'
      - name: Upload large jax report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-jax
          path: artifacts/test-reports/large-jax/**
          if-no-files-found: ignore

  tests-large-amrex:
    needs: [meta]
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive
      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull AMReX placeholder image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_amrex_dummy:latest"
      - name: Generate large amrex report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_amrex_dummy:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core -e library/zoomy_amrex && python tests/reporting/generate_test_report.py \
              --markers "(large or benchmark) and amrex" \
              --run-large \
              --run-benchmark \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/large-amrex'
      - name: Upload large amrex report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-amrex
          path: artifacts/test-reports/large-amrex/**
          if-no-files-found: ignore

  tests-large-dmplex-firedrake:
    needs: [meta]
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive
      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull zoomy_firedrake image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_firedrake:latest"
      - name: Generate large DMPlex and Firedrake reports
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_firedrake:latest" \
            bash -lc 'python3 -m pip install --no-cache-dir -q -e library/zoomy_core -e library/firedrake_animate -e library/zoomy_firedrake && \
              ( python3 tests/reporting/generate_test_report.py \
                  --markers "(large or benchmark) and dmplex" \
                  --run-large \
                  --run-benchmark \
                  --ignore-pytest-exit-code \
                  --allow-no-tests \
                  --output-dir artifacts/test-reports/large-dmplex; \
                python3 tests/reporting/generate_test_report.py \
                  --markers "(large or benchmark) and firedrake" \
                  --run-large \
                  --run-benchmark \
                  --ignore-pytest-exit-code \
                  --allow-no-tests \
                  --output-dir artifacts/test-reports/large-firedrake )'
      - name: Upload large DMPlex report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-dmplex
          path: artifacts/test-reports/large-dmplex/**
          if-no-files-found: ignore
      - name: Upload large Firedrake report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-firedrake
          path: artifacts/test-reports/large-firedrake/**
          if-no-files-found: ignore

  tests-large-fenicsx:
    needs: [meta]
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive
      - name: Set lowercase owner
        id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FEniCSx placeholder image
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_fenicsx_dummy:latest"
      - name: Generate large FEniCSx report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/zoomy_fenicsx_dummy:latest" \
            bash -lc 'python -m pip install --no-cache-dir -q -e library/zoomy_core && if [ -f library/zoomy_fenicsx/pyproject.toml ]; then python -m pip install --no-cache-dir -q -e library/zoomy_fenicsx; fi && python tests/reporting/generate_test_report.py \
              --markers "(large or benchmark) and fenicsx" \
              --run-large \
              --run-benchmark \
              --ignore-pytest-exit-code \
              --allow-no-tests \
              --output-dir artifacts/test-reports/large-fenicsx'
      - name: Upload large FEniCSx report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-fenicsx
          path: artifacts/test-reports/large-fenicsx/**
          if-no-files-found: ignore

  aggregate-large-reports:
    name: Bundle large-suite reports
    needs:
      - tests-large-core
      - tests-large-jax
      - tests-large-amrex
      - tests-large-dmplex-firedrake
      - tests-large-fenicsx
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Init bundle directory
        run: mkdir -p artifacts/test-reports/large
      - name: Download large core report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-report-large-core
          path: artifacts/test-reports/large/core
      - name: Download large jax report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-report-large-jax
          path: artifacts/test-reports/large/jax
      - name: Download large amrex report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-report-large-amrex
          path: artifacts/test-reports/large/amrex
      - name: Download large DMPlex report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-report-large-dmplex
          path: artifacts/test-reports/large/dmplex
      - name: Download large Firedrake report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-report-large-firedrake
          path: artifacts/test-reports/large/firedrake
      - name: Download large FEniCSx report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-report-large-fenicsx
          path: artifacts/test-reports/large/fenicsx
      - name: Detect merged large HTML reports
        id: check
        run: |
          if [ -d artifacts/test-reports/large ] && \
             find artifacts/test-reports/large -name report.html -print -quit | grep -q .; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload large-suite bundle
        if: steps.check.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-large-bundle
          path: artifacts/test-reports/large

