name: Smart Tests

# Three report groups (user ruling, 2026-07-24):
#   zoomy      — the superproject `tests/`, run per backend.
#   library    — each library/zoomy_*/tests, run in its backend container
#                (prepost/server are pure-Python → the core image).
#   notebooks  — tests/notebooks/ (@pytest.mark.notebook), published tutorials
#                executed end to end, per backend they need.
#
# Two tiers:
#   small  — every push and PR. A REAL GATE: a failing test fails the job.
#            Excludes `regression` (that lands in the weekly tier).
#   large  — weekly (Sun 03:00 UTC) + manual. large / benchmark / regression.
#
# Each report unit runs in ONE container, pip-installs the checked-out tree over
# it (so reports match the commit), and writes to
#   artifacts/test-reports/<tier>/<group>/<unit>/<timestamp>/{report.html,junit.xml}
# The bundle job reshapes those into test-reports-{small,large}-bundle, which
# Render Webpage downloads to build docs/book/ci-reports.md.
#
# amrex's library suite is a STANDALONE pytest project (its tests/ is a package
# doing `from tests.conftest import ...`) that collides with the superproject's
# `tests` package from the repo root — so it runs via --chdir into its own
# rootdir. See docs/book/ci-reports.md "Architecture".
#
# Interpreter differs per image: core/jax are conda/slim (`python`, no PEP 668);
# amrex/foam are Ubuntu system python (`python3`, --break-system-packages).

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/tests-report.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/tests-report.yml"
  workflow_dispatch:
    inputs:
      run_large:
        description: "Also run the large/benchmark/regression suite"
        required: false
        default: "false"
  workflow_run:
    workflows: [ "Containers" ]
    types: [ completed ]
  schedule:
    - cron: "0 3 * * 0"   # weekly large/regression run, Sunday 03:00 UTC

jobs:
  meta:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      checkout_ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------ reports
  report:
    name: ${{ matrix.group }}·${{ matrix.unit }}
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- zoomy: superproject tests/, per backend --------------------
          - { group: zoomy, unit: core, image: zoomy_core, py: python, pipflags: "",
              installs: "-e library/zoomy_core pytest-html", paths: "tests", chdir: "",
              small: "small and not regression and (core or (numpy and not jax))",
              large: "(large or benchmark or regression) and (core or (numpy and not jax))" }
          - { group: zoomy, unit: jax, image: zoomy_jax, py: python, pipflags: "",
              installs: "-e library/zoomy_core -e library/zoomy_jax pytest-html", paths: "tests", chdir: "",
              small: "small and not regression and jax",
              large: "(large or benchmark or regression) and jax" }
          - { group: zoomy, unit: amrex, image: zoomy_amrex, py: python3, pipflags: "--break-system-packages",
              installs: "-e library/zoomy_core -e library/zoomy_amrex pytest-html", paths: "tests", chdir: "",
              small: "small and not regression and amrex",
              large: "(large or benchmark or regression) and amrex" }
          - { group: zoomy, unit: foam, image: zoomy_openfoam, py: python3, pipflags: "--break-system-packages",
              installs: "-e library/zoomy_core -e library/zoomy_foam pytest-html", paths: "tests", chdir: "",
              small: "small and not regression and openfoam",
              large: "(large or benchmark or regression) and openfoam" }
          # ---- library: each submodule's own tests/ -----------------------
          - { group: library, unit: core, image: zoomy_core, py: python, pipflags: "",
              installs: "-e library/zoomy_core pytest-html", paths: "library/zoomy_core/tests", chdir: "",
              small: "small and not regression and (core or (numpy and not jax))",
              large: "(large or benchmark or regression) and (core or (numpy and not jax))" }
          # extra deselect: test_dambreak_o2_runs_and_converges hangs (order-2
          # dam break hits dt->0 and loops forever through XLA — a real jax bug,
          # flagged for the jax steward). Deselected so the suite still reports;
          # the job timeout would otherwise kill it before pytest writes a report.
          - { group: library, unit: jax, image: zoomy_jax, py: python, pipflags: "",
              installs: "-e library/zoomy_core -e library/zoomy_jax pytest-html", paths: "library/zoomy_jax/tests", chdir: "",
              extra: "--deselect library/zoomy_jax/tests/test_swe_dambreak_jax.py::test_dambreak_o2_runs_and_converges",
              small: "small and not regression and jax",
              large: "(large or benchmark or regression) and jax" }
          # amrex runs from its own rootdir (--chdir); paths empty so its own
          # [tool.pytest.ini_options] testpaths=["tests"] governs collection —
          # passing `tests` explicitly fights that and errors "not found: tests".
          - { group: library, unit: amrex, image: zoomy_amrex, py: python3, pipflags: "--break-system-packages",
              installs: "-e library/zoomy_core -e library/zoomy_amrex pytest-html", paths: "", chdir: "library/zoomy_amrex",
              small: "small and not regression",
              large: "large or benchmark or regression" }
          - { group: library, unit: foam, image: zoomy_openfoam, py: python3, pipflags: "--break-system-packages",
              installs: "-e library/zoomy_core -e library/zoomy_foam pytest-html", paths: "library/zoomy_foam/tests", chdir: "",
              small: "small and not regression and openfoam",
              large: "(large or benchmark or regression) and openfoam" }
          - { group: library, unit: prepost, image: zoomy_core, py: python, pipflags: "",
              installs: "-e library/zoomy_core -e library/zoomy_plotting -e library/zoomy_prepost pytest-html",
              paths: "library/zoomy_prepost/tests", chdir: "",
              small: "small and not regression",
              large: "large or benchmark or regression" }
          - { group: library, unit: server, image: zoomy_core, py: python, pipflags: "",
              installs: "-e library/zoomy_core -e library/zoomy_plotting -e library/zoomy_prepost -e library/zoomy_server pytest-html httpx",
              paths: "library/zoomy_server/tests", chdir: "",
              small: "small and not regression",
              large: "large or benchmark or regression" }
          # ---- notebooks: published tutorials, per backend (small only) ----
          - { group: notebooks, unit: core, image: zoomy_core, py: python, pipflags: "",
              installs: "-e library/zoomy_core -e library/zoomy_plotting pytest-html jupytext nbclient nbformat ipykernel",
              paths: "tests/notebooks", chdir: "",
              small: "notebook and core", large: "" }
          - { group: notebooks, unit: amrex, image: zoomy_amrex, py: python3, pipflags: "--break-system-packages",
              installs: "-e library/zoomy_core -e library/zoomy_amrex pytest-html jupytext nbclient nbformat ipykernel",
              paths: "tests/notebooks", chdir: "",
              small: "notebook and amrex", large: "" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          submodules: recursive

      - id: own
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ${{ matrix.image }}
        run: docker pull "ghcr.io/${{ steps.own.outputs.lc }}/${{ matrix.image }}:latest"

      # small tier — every event EXCEPT the weekly schedule. Real gate.
      - name: small · ${{ matrix.group }}/${{ matrix.unit }}
        if: github.event_name != 'schedule'
        run: |
          CHDIR="${{ matrix.chdir }}"; CHARG=""; [ -n "$CHDIR" ] && CHARG="--chdir $CHDIR"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/${{ matrix.image }}:latest" \
            bash -lc "${{ matrix.py }} -m pip install --no-cache-dir -q ${{ matrix.pipflags }} pytest-timeout ${{ matrix.installs }} && \
              ${{ matrix.py }} tests/reporting/generate_test_report.py \
                --markers '${{ matrix.small }}' --pytest-paths '${{ matrix.paths }}' $CHARG \
                --allow-no-tests \
                --extra-pytest-args '--timeout=300 --timeout-method=signal ${{ matrix.extra }}' \
                --output-dir artifacts/test-reports/small/${{ matrix.group }}/${{ matrix.unit }}"

      # large tier — weekly schedule, or a manual run with large enabled. Units
      # with an empty `large` marker (notebooks) skip it.
      - name: large · ${{ matrix.group }}/${{ matrix.unit }}
        if: >
          matrix.large != '' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true'))
        run: |
          CHDIR="${{ matrix.chdir }}"; CHARG=""; [ -n "$CHDIR" ] && CHARG="--chdir $CHDIR"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e LOGURU_LEVEL=WARNING \
            "ghcr.io/${{ steps.own.outputs.lc }}/${{ matrix.image }}:latest" \
            bash -lc "${{ matrix.py }} -m pip install --no-cache-dir -q ${{ matrix.pipflags }} ${{ matrix.installs }} && \
              ${{ matrix.py }} tests/reporting/generate_test_report.py \
                --markers '${{ matrix.large }}' --pytest-paths '${{ matrix.paths }}' $CHARG \
                --run-large --run-benchmark --allow-no-tests \
                --extra-pytest-args '${{ matrix.extra }}' \
                --output-dir artifacts/test-reports/large/${{ matrix.group }}/${{ matrix.unit }}"

      - name: Upload small report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-small-${{ matrix.group }}-${{ matrix.unit }}
          path: artifacts/test-reports/small/${{ matrix.group }}/${{ matrix.unit }}/**
          if-no-files-found: ignore

      - name: Upload large report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-large-${{ matrix.group }}-${{ matrix.unit }}
          path: artifacts/test-reports/large/${{ matrix.group }}/${{ matrix.unit }}/**
          if-no-files-found: ignore

  # --------------------------------------------------------------- aggregation
  # Render Webpage downloads test-reports-{small,large}-bundle BY NAME and
  # extracts each into artifacts/test-reports/{small,large}/, where the docs
  # generator expects <group>/<unit>/.
  bundle:
    name: Bundle ${{ matrix.tier }} reports
    needs: [report]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [small, large]
    steps:
      - name: Download ${{ matrix.tier }} unit reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-report-${{ matrix.tier }}-*
          path: staging

      - name: Reshape into ${{ matrix.tier }}/<group>/<unit>/
        run: |
          dst="artifacts/test-reports/${{ matrix.tier }}"
          mkdir -p "$dst"
          for d in staging/test-report-${{ matrix.tier }}-*; do
            [ -d "$d" ] || continue
            rest="$(basename "$d")"; rest="${rest#test-report-${{ matrix.tier }}-}"
            group="${rest%%-*}"; unit="${rest#*-}"
            mkdir -p "$dst/$group/$unit"
            cp -r "$d/." "$dst/$group/$unit/"
          done

      - id: check
        run: |
          if find "artifacts/test-reports/${{ matrix.tier }}" \( -name report.html -o -name junit.xml \) -print -quit | grep -q .; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ${{ matrix.tier }} bundle
        if: steps.check.outputs.has == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.tier }}-bundle
          path: artifacts/test-reports/${{ matrix.tier }}
