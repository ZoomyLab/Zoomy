name: Smart Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - ".github/workflows/tests-report.yml"
  workflow_dispatch:
    inputs:
      run_large:
        description: "Also run large/benchmark test suite"
        required: false
        default: "false"
  pull_request:
    branches: [ main, master ]
    paths:
      - "library/**"
      - "tests/**"
      - "tutorials/**"
      - "pytest.ini"
      - ".github/workflows/tests-report.yml"
  schedule:
    # Weekly large/benchmark run (Sunday 03:00 UTC)
    - cron: "0 3 * * 0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ github.event_name == 'pull_request' && steps.filter.outputs.core || steps.defaults.outputs.core }}
      jax: ${{ github.event_name == 'pull_request' && steps.filter.outputs.jax || steps.defaults.outputs.jax }}
      amrex: ${{ github.event_name == 'pull_request' && steps.filter.outputs.amrex || steps.defaults.outputs.amrex }}
      petsc: ${{ github.event_name == 'pull_request' && steps.filter.outputs.petsc || steps.defaults.outputs.petsc }}
      firedrake: ${{ github.event_name == 'pull_request' && steps.filter.outputs.firedrake || steps.defaults.outputs.firedrake }}
      infra: ${{ github.event_name == 'pull_request' && steps.filter.outputs.infra || steps.defaults.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            core:
              - 'library/zoomy_core/**'
              - 'tests/unit/zoomy_core/**'
              - 'tests/regression/zoomy_core/**'
              - 'tests/scripts/**'
              - 'tutorials/swe/**'
              - 'tutorials/poisson/**'
            jax:
              - 'library/zoomy_jax/**'
              - 'tests/unit/zoomy_jax/**'
              - 'tests/regression/zoomy_jax/**'
              - 'tests/benchmarks/zoomy_jax/**'
              - 'tests/scripts/**'
            amrex:
              - 'library/zoomy_amrex/**'
              - 'tests/unit/zoomy_amrex/**'
              - 'tests/regression/zoomy_amrex/**'
              - 'tests/benchmarks/zoomy_amrex/**'
              - 'tutorials/amrex/**'
            petsc:
              - 'library/zoomy_dmplex/**'
              - 'library/zoomy_fenicsx/**'
              - 'tests/unit/zoomy_dmplex/**'
              - 'tests/unit/zoomy_fenicsx/**'
              - 'tests/regression/zoomy_dmplex/**'
              - 'tests/regression/zoomy_fenicsx/**'
              - 'tests/benchmarks/zoomy_dmplex/**'
              - 'tests/benchmarks/zoomy_fenicsx/**'
              - 'tutorials/dmplex/**'
              - 'tutorials/dolfinx/**'
            firedrake:
              - 'library/zoomy_firedrake/**'
              - 'library/firedrake_animate/**'
              - 'tests/unit/zoomy_firedrake/**'
              - 'tests/regression/zoomy_firedrake/**'
              - 'tests/benchmarks/zoomy_firedrake/**'
              - 'tutorials/firedrake/**'
            infra:
              - 'pytest.ini'
              - 'tests/conftest.py'
              - 'tests/reporting/**'
              - '.github/workflows/tests-report.yml'
      - id: defaults
        if: github.event_name != 'pull_request'
        run: |
          echo "core=true" >> "$GITHUB_OUTPUT"
          echo "jax=true" >> "$GITHUB_OUTPUT"
          echo "amrex=true" >> "$GITHUB_OUTPUT"
          echo "petsc=true" >> "$GITHUB_OUTPUT"
          echo "firedrake=true" >> "$GITHUB_OUTPUT"
          echo "infra=true" >> "$GITHUB_OUTPUT"

  tests-core:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
      
      - name: Generate core report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "small and (core or (numpy and not jax))" \
            --output-dir artifacts/test-reports/core

      - name: Upload core report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report-core
          path: artifacts/test-reports/core/**

  tests-jax:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.jax == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jax deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          python -m pip install -e "library/zoomy_jax"
      
      - name: Generate jax report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "small and jax" \
            --output-dir artifacts/test-reports/jax

      - name: Upload jax report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jax
          path: artifacts/test-reports/jax/**

  tests-amrex:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.amrex == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install amrex test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          if [ -f tests/requirements/amrex.txt ]; then python -m pip install -r tests/requirements/amrex.txt; fi

      - name: Generate amrex report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "small and amrex" \
            --allow-no-tests \
            --output-dir artifacts/test-reports/amrex

      - name: Upload amrex report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report-amrex
          path: artifacts/test-reports/amrex/**

  tests-petsc:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.petsc == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install petsc test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          if [ -f library/zoomy_fenicsx/pyproject.toml ]; then python -m pip install -e "library/zoomy_fenicsx"; fi
          if [ -f tests/requirements/petsc.txt ]; then python -m pip install -r tests/requirements/petsc.txt; fi

      - name: Generate petsc report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "small and petsc" \
            --allow-no-tests \
            --output-dir artifacts/test-reports/petsc

      - name: Upload petsc report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report-petsc
          path: artifacts/test-reports/petsc/**

  tests-firedrake:
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.firedrake == 'true' || needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install firedrake test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          if [ -f library/zoomy_firedrake/pyproject.toml ]; then python -m pip install -e "library/zoomy_firedrake"; fi
          if [ -f tests/requirements/firedrake.txt ]; then python -m pip install -r tests/requirements/firedrake.txt; fi

      - name: Generate firedrake report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "small and firedrake" \
            --allow-no-tests \
            --output-dir artifacts/test-reports/firedrake

      - name: Upload firedrake report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report-firedrake
          path: artifacts/test-reports/firedrake/**

  tests-large-core:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
      - name: Generate large core report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "(large or benchmark) and (core or (numpy and not jax))" \
            --run-large \
            --run-benchmark \
            --allow-no-tests \
            --output-dir artifacts/test-reports/large-core
      - name: Upload large core report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-large-core
          path: artifacts/test-reports/large-core/**

  tests-large-jax:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jax deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          python -m pip install -e "library/zoomy_jax"
      - name: Generate large jax report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "(large or benchmark) and jax" \
            --run-large \
            --run-benchmark \
            --allow-no-tests \
            --output-dir artifacts/test-reports/large-jax
      - name: Upload large jax report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-large-jax
          path: artifacts/test-reports/large-jax/**

  tests-large-amrex:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install amrex test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          if [ -f tests/requirements/amrex.txt ]; then python -m pip install -r tests/requirements/amrex.txt; fi
      - name: Generate large amrex report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "(large or benchmark) and amrex" \
            --run-large \
            --run-benchmark \
            --allow-no-tests \
            --output-dir artifacts/test-reports/large-amrex
      - name: Upload large amrex report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-large-amrex
          path: artifacts/test-reports/large-amrex/**

  tests-large-petsc:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install petsc test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          if [ -f library/zoomy_fenicsx/pyproject.toml ]; then python -m pip install -e "library/zoomy_fenicsx"; fi
          if [ -f tests/requirements/petsc.txt ]; then python -m pip install -r tests/requirements/petsc.txt; fi
      - name: Generate large petsc report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "(large or benchmark) and petsc" \
            --run-large \
            --run-benchmark \
            --allow-no-tests \
            --output-dir artifacts/test-reports/large-petsc
      - name: Upload large petsc report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-large-petsc
          path: artifacts/test-reports/large-petsc/**

  tests-large-firedrake:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_large == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install firedrake test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/reporting/requirements.txt
          python -m pip install -e "library/zoomy_core"
          if [ -f library/zoomy_firedrake/pyproject.toml ]; then python -m pip install -e "library/zoomy_firedrake"; fi
          if [ -f tests/requirements/firedrake.txt ]; then python -m pip install -r tests/requirements/firedrake.txt; fi
      - name: Generate large firedrake report
        run: |
          python tests/reporting/generate_test_report.py \
            --markers "(large or benchmark) and firedrake" \
            --run-large \
            --run-benchmark \
            --allow-no-tests \
            --output-dir artifacts/test-reports/large-firedrake
      - name: Upload large firedrake report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-large-firedrake
          path: artifacts/test-reports/large-firedrake/**

  aggregate-large-reports:
    name: Bundle large-suite reports
    needs:
      - tests-large-core
      - tests-large-jax
      - tests-large-amrex
      - tests-large-petsc
      - tests-large-firedrake
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Init bundle directory
        run: mkdir -p artifacts/test-reports/large
      - name: Download large core report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-large-core
          path: artifacts/test-reports/large/core
      - name: Download large jax report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-large-jax
          path: artifacts/test-reports/large/jax
      - name: Download large amrex report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-large-amrex
          path: artifacts/test-reports/large/amrex
      - name: Download large petsc report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-large-petsc
          path: artifacts/test-reports/large/petsc
      - name: Download large firedrake report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-large-firedrake
          path: artifacts/test-reports/large/firedrake
      - name: Detect merged large HTML reports
        id: check
        run: |
          if [ -d artifacts/test-reports/large ] && \
             find artifacts/test-reports/large -name report.html -print -quit | grep -q .; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload large-suite bundle
        if: steps.check.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-large-bundle
          path: artifacts/test-reports/large

  aggregate-small-reports:
    name: Bundle small-suite reports
    needs: [tests-core, tests-jax, tests-amrex, tests-petsc, tests-firedrake]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Init bundle directory
        run: mkdir -p artifacts/test-reports/small
      - name: Download core report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-core
          path: artifacts/test-reports/small/core
      - name: Download jax report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-jax
          path: artifacts/test-reports/small/jax
      - name: Download amrex report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-amrex
          path: artifacts/test-reports/small/amrex
      - name: Download petsc report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-petsc
          path: artifacts/test-reports/small/petsc
      - name: Download firedrake report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report-firedrake
          path: artifacts/test-reports/small/firedrake
      - name: Detect merged HTML reports
        id: check
        run: |
          if [ -d artifacts/test-reports/small ] && \
             find artifacts/test-reports/small -name report.html -print -quit | grep -q .; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload small-suite bundle
        if: steps.check.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-small-bundle
          path: artifacts/test-reports/small

